---
# Host-specific configuration for the overmind LXC (sub2api)
# Inherits from: tier_small, cap_docker

lxc_hwaddr: "BC:24:11:0B:3D:9D"
default_domain: admin.faviann.com

traefik_kop_enabled: false

proxmox_lxc_host_directories:
  - path: /tank/overmind
    owner: "100000"
    group: "100000"
    mode: "0755"
  - path: /tank/backups/overmind
    owner: "100000"
    group: "100000"
    mode: "0700"

lxc_docker_env_stack_vars:
  sub2api:
    postgres_password: "{{ vault_overmind_sub2api_postgres_password }}"
    jwt_secret: "{{ vault_overmind_sub2api_jwt_secret }}"
    totp_encryption_key: "{{ vault_overmind_sub2api_totp_encryption_key }}"
    oidc_client_secret: "{{ vault_overmind_sub2api_oidc_client_secret }}"

proxmox_lxc_bind_mounts_overrides:
  mp3: "/tank/overmind,mp=/data/overmind"
  mp4: "/tank/backups/overmind,mp=/backups/overmind"

# Container definition for proxmox_lxc_provision role
proxmox_lxc_overrides:
  vmid: 307
  hostname: overmind
  description: "sub2api managed via Ansible"
  tags:
    - ansible
    - overmind
    - memory
