---
# Host-specific configuration for the Jellyfin media server
# Inherits from: tier_large, cap_docker, cap_gpu

lxc_hwaddr: "BC:24:11:A1:82:92"
default_domain: public.faviann.com

lxc_docker_env_stack_vars:
  jellystat:
    jwt_secret: "{{ vault_jellystat_jwt_secret }}"
    postgres_password: "{{ vault_jellystat_postgres_password }}"

# This host mounts only its own /ephemeral folder, at the same path.
proxmox_lxc_bind_mounts_overrides:
  mp2: "/ephemeral/jellyfin,mp=/ephemeral/jellyfin"

proxmox_lxc_host_directories:
  - path: /ephemeral/jellyfin
    owner: "1001"
    group: "1001"

# Container definition for proxmox_lxc_provision role
proxmox_lxc_overrides:
  vmid: 304
  hostname: jellyfin
  disk: "16"
  description: "Jellyfin media server"
  tags:
    - ansible
    - media
    - jellyfin
    - gpu
