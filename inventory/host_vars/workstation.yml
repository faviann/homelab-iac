---
# Host-specific configuration for the workstation LXC
# Inherits from: tier_large, cap_docker

lxc_hwaddr: "BC:24:11:57:80:06"
workstation_enabled: true
lxc_origin_firewall_enabled: true
lxc_origin_firewall_protected_ports:
  - 4001 # Agent of Empires proxy
  - 9119 # Hermes dashboard
  - 18789 # OpenClaw gateway
  - 8788 # Reserved Collie origin
  - 19081 # MCP auth proxy
lxc_origin_firewall_allowed_hosts:
  - portal
workstation_bw_download_url: >-
  https://github.com/bitwarden/clients/releases/download/cli-v{{
  workstation_bw_version }}/bw-linux-{{ workstation_bw_version }}.zip
workstation_bw_release_api_url: "https://api.github.com/repos/bitwarden/clients/releases/tags/cli-v{{ workstation_bw_version }}"
# Persist selected workstation home paths across intentional LXC rebuilds.
workstation_persistent_home_enabled: true

docker_agents_enabled: false
traefik_kop_enabled: false

lxc_docker_env_stack_vars:
  mcp-auth-proxy:
    oidc_client_secret: "{{ vault_moraine_mcp_oidc_client_secret }}"
    auth_hmac_secret: "{{ vault_workstation_mcp_auth_proxy_hmac_secret }}"
    jwt_private_key: "{{ vault_workstation_mcp_auth_proxy_jwt_private_key }}"
    trusted_proxies: "{{ hostvars['portal'].portal_traefik_source_cidr }}"

# Container definition for proxmox_lxc_provision role
proxmox_lxc_overrides:
  vmid: 306
  hostname: workstation
  cores: 16
  memory: 32768
  disk: "128"
  description: "Persistent remote coding workstation managed via Ansible"
  tags:
    - ansible
    - workstation
    - development
