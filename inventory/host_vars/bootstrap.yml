---
# Host-specific configuration for the bootstrap node, the control node that
# runs the nightly deploy and interrupting workstation runs (docs/bootstrap-node.md)
# Inherits from: tier_small

lxc_hwaddr: "BC:24:11:87:8C:71"
bootstrap_node_enabled: true
bootstrap_deploy_discord_webhook_url: "{{ vault_dockhand_discord_webhook_url }}"
# Busy while a deploy holds its lock, so a run against this node
# never upgrades or reboots it under that deploy.
lxc_busy_check_host_command: >-
  flock --nonblock /run/homelab-deploy.lock true
  || { echo "a deploy is in flight"; exit 1; }

proxmox_lxc_overrides:
  vmid: 101
  hostname: bootstrap
  description: "Bootstrap control node for interrupting workstation changes and recovery, managed via Ansible"
  tags:
    - ansible
    - bootstrap
    - control-node
