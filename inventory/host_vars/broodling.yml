---
# Host-specific configuration for the Broodling PR agent service
# Inherits from: tier_medium, cap_docker
# See stacks/broodling/broodling/README.md

lxc_hwaddr: "BC:24:11:99:89:7B"

# Its agents run untrusted code, so no Docker-API agent, and no Traefik route
# until #354.
docker_agents_enabled: false
traefik_kop_enabled: false

# The ownership Broodling's deployment guide requires for its service users
# (broodling 1654, Caddy 10443). The targets' state and home are created once
# by the initialization instead, because native relaxes their modes.
lxc_docker_env_host_directories:
  - path: /data/broodling/broodling
    owner: "1654"
    group: "1654"
    mode: "0700"
  - path: /data/broodling/broodling/repositories
    owner: "1654"
    group: "1654"
    mode: "0700"
  - path: /data/broodling/zeroshot-tls/key
    owner: "10443"
    group: "10443"
    mode: "0700"
  - path: /data/broodling/zeroshot-tls/root
    owner: "0"
    group: "0"
    mode: "0755"

proxmox_lxc_host_directories:
  - path: /tank/broodling
    owner: "100000"
    group: "100000"
    mode: "0755"

# Replace the fleet-wide /tank mount with this LXC's own subtree.
proxmox_lxc_bind_mounts_overrides:
  mp3: "/tank/broodling,mp=/data/broodling"

lxc_docker_env_stack_vars:
  broodling:
    # Published as sha-3955ee171f12fe2b83ee9f326d2de4ac09e21e21.
    broodling_image: "ghcr.io/faviann/broodling@sha256:482969b0f57cccab921f4bd465cb607f6074412edc7789861359cff641cf35e0"
    broodling_revision: "3955ee171f12fe2b83ee9f326d2de4ac09e21e21"
    github_token: "{{ vault_broodling_github_token }}"
    gateway_api_key: "{{ vault_broodling_gateway_api_key }}"
    dotnet:
      # The image and manifest.sha256 come from that revision's
      # src/Broodling/environments/dotnet-r6.adoption.json. The image must be
      # byte-identical, because the catalog image must match a bundled adoption.
      release: dotnet-r6
      image: "ghcr.io/faviann/zeroshot-environments/dotnet@sha256:b10a72289a66fc9caeaa5c3bb79a953dd225c6fba75d882d42a0dfe57d69dc4c"
      manifest_sha256: "304a417ca752e22652b66f3de47a5995247a45339ccd9fad8221f8f0b29fb89b"
      control_token: "{{ vault_broodling_dotnet_control_token }}"
      bootstrap_key: "{{ vault_broodling_dotnet_bootstrap_key }}"

# Container definition for proxmox_lxc_provision role
proxmox_lxc_overrides:
  vmid: 311
  hostname: broodling
  # tier_medium's 8 GB root cannot hold the ~3.3 GB dotnet environment image
  # beside Broodling's and their upgrades.
  disk: "16"
  description: "Broodling PR agent service managed via Ansible"
  tags:
    - ansible
    - broodling
    - agents
