---
# Capability group: browser device
# One LXC, one Chrome profile, one authenticated identity. Not a Docker host.

browser_device_enabled: true

# The browser session runs as its own account, never the operator's uid 1000.
browser_device_session_user: crawler
browser_device_session_uid: 1001

# No fleet bind mounts. Shared directories are 0755 and files 0644, so any uid
# could read them; the Chrome profile stays on the root disk.
proxmox_default_bind_mounts: {}

browser_device_display_geometry: 1920x1080

# Chrome installs these by managed policy on every start, including from an empty profile.
browser_device_extension_ids:
  - jhgcecbdpnoehfnhpdfihlchjddapepi # Owletto

# Xvnc listens on loopback only. websockify serves the noVNC session view and
# accepts loopback and portal, where Traefik puts Authentik in front of it.
browser_device_session_view_port: 6080
lxc_origin_firewall_enabled: true
lxc_origin_firewall_protected_ports:
  - "{{ browser_device_session_view_port }}"
lxc_origin_firewall_allowed_hosts:
  - portal

# Chrome keeps its sandbox, which needs user namespaces. No keyctl: there is no Docker.
proxmox_lxc_capability_defaults:
  features:
    - nesting=1
