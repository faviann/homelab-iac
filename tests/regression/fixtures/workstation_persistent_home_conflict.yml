---
- name: Test workstation persistent home conflict path
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    workstation_username: "{{ lookup('pipe', 'id -un') }}"
    workstation_uid: "{{ lookup('pipe', 'id -u') | int }}"
    workstation_gid: "{{ lookup('pipe', 'id -g') | int }}"
    workstation_home: "{{ temp_root }}/home/{{ workstation_username }}"
    workstation_persistent_home_enabled: true
    workstation_persistent_home_root: "{{ temp_root }}/ephemeral/workstation/home"
    workstation_persistent_home_mount_state: mounted
    workstation_persistent_home_fstab_path: "{{ temp_root }}/fstab"
    workstation_persistent_home_links:
      - name: lobu
        type: bind_mount
        path: "{{ workstation_home }}/.config/lobu"
        target: "{{ workstation_persistent_home_root }}/.config/lobu"
        mode: "0700"
      - name: claude
        type: bind_mount
        path: "{{ workstation_home }}/.claude"
        target: "{{ workstation_persistent_home_root }}/.claude"
        mode: "0700"
      - name: claude_config
        type: bind_file
        path: "{{ workstation_home }}/.claude.json"
        target: "{{ workstation_persistent_home_root }}/.claude.json"
        mode: "0600"
        content: "{}\n"
  tasks:
    - name: Ensure workstation home exists
      ansible.builtin.file:
        path: "{{ workstation_home }}"
        state: directory
        mode: "0755"

    - name: Create conflicting Claude state directory
      ansible.builtin.file:
        path: "{{ workstation_home }}/.claude"
        state: directory
        mode: "0700"

    - name: Create conflicting Lobu state directory
      ansible.builtin.file:
        path: "{{ workstation_home }}/.config/lobu"
        state: directory
        mode: "0700"

    - name: Populate conflicting Lobu state
      ansible.builtin.copy:
        dest: "{{ workstation_home }}/.config/lobu/credentials.json"
        content: synthetic-auth-state
        mode: "0600"

    - name: Create conflicting Claude onboarding state
      ansible.builtin.copy:
        dest: "{{ workstation_home }}/.claude.json"
        content: |
          {"hasCompletedOnboarding":true}
        mode: "0600"

    - name: Include focused workstation persistent home tasks
      ansible.builtin.include_role:
        name: config/lxc_workstation_baseline
        tasks_from: persistent_home
