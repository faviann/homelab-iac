---
- name: Exercise fleet preflight through the lifecycle facade
  hosts: lxcs
  connection: local
  gather_facts: false
  tasks:
    - name: Invoke the lifecycle facade
      block:
        - name: Plan the targeted LXC lifecycle
          ansible.builtin.include_role:
            name: provisioning/proxmox_lxc_lifecycle
            tasks_from: plan
      rescue:
        - name: Capture the observable fleet preflight failure
          ansible.builtin.set_fact:
            fleet_observed_failure: "{{ ansible_failed_result.msg }}"

    - name: Assert the planner reached its expected outcome
      ansible.builtin.assert:
        that:
          - fleet_observed_failure is not defined
          - lxc_lifecycle_result.outcome.status == fleet_expected_status | default('validated')

    - name: Assert successful planners consumed the common observation
      ansible.builtin.assert:
        that:
          - lxc_lifecycle_result.observations.before.runtime_state == 'stopped'
          - proxmox_fleet_target_observations[inventory_hostname].common_observation | bool
          - proxmox_fleet_common_observation | length == 3
      when: fleet_expected_status is not defined

    # Structured ownership, not message text, decides which target a problem
    # fails; each conflict must be owned by exactly its own target. Problem
    # records live on the host that coordinated the run-once preflight.
    - name: Assert each target owns exactly its expected identity problem
      ansible.builtin.assert:
        that:
          - owned_messages | length == 1
          - owned_messages[0] is search(hostvars[item].fleet_expected_owned_problem)
      vars:
        owned_messages: >-
          {{
            proxmox_fleet_preflight_problem_records
            | selectattr('cause_hosts', 'equalto', [item])
            | map(attribute='message')
            | list
          }}
      loop: "{{ ansible_play_hosts_all }}"
      when: hostvars[item].fleet_expected_owned_problem is defined
      run_once: true

    - name: Assert an otherwise valid planner was blocked by its causative peer
      ansible.builtin.assert:
        that:
          - fleet_expected_status_fragment in lxc_lifecycle_result.outcome.reason
      when: fleet_expected_status_fragment is defined

    - name: Assert shared problems have no causative target hosts
      ansible.builtin.assert:
        that:
          - proxmox_fleet_preflight_problem_records | length > 0
          - >-
            proxmox_fleet_preflight_problem_records
            | map(attribute='cause_hosts')
            | reject('equalto', [])
            | list
            | length == 0
      when: fleet_expected_shared_problem | default(false) | bool
      run_once: true
