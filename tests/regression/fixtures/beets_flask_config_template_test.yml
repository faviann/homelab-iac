---
- name: Test the real beets-flask config template keeps its secrets unescaped
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    beets_config_template: "{{ repo_root }}/stacks/servarr/beets-flask/appdata/beets/config.yaml.j2"
    stack_vars:
      acoustid_apikey: "acoustid-pa$$"
      discogs_token: "discogs-pa$$"
  tasks:
    - name: Evaluate the real beets-flask config template
      ansible.builtin.set_fact:
        rendered_beets_config: "{{ lookup('template', beets_config_template) }}"

    - name: Assert the rendered beets-flask config receives its secrets unescaped
      ansible.builtin.assert:
        that:
          - "'apikey: \"acoustid-pa$$\"' in rendered_beets_config"
          - "'user_token: \"discogs-pa$$\"' in rendered_beets_config"
        fail_msg: >-
          The beets-flask config template must pass AcoustID and Discogs values through
          unescaped. Compose-dollar escaping belongs to .env.j2 only.
