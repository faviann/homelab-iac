---
- name: Test stack sync reconciliation boundary
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    docker_agents_enabled: false
    lxc_stack_sync_managed_assets:
      changed_results: []
    repo_only_stack_files:
      - README.md
      - docs/operator.md
      - stack.yml
      - metadata.yaml
      - metadata.yml
      - metadata.json
    deployed_myapp: "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/myapp"
    myapp_source: "{{ lxc_docker_environment_internal.stacks_source }}/myapp"
    lxc_docker_environment_internal:
      shared_mount_source: "{{ temp_root }}/shared"
      root_docker_conf_path: "{{ temp_root }}/shared"
      stacks_source: "{{ temp_root }}/stacks-source"
      stale_stack_quarantine_root: "{{ temp_root }}/shared/stale-stacks"
      external_networks:
        - proxy
      path_ownership_overrides: []
      shared_owner: "{{ ansible_user_uid }}"
      shared_group: "{{ ansible_user_gid }}"
      docker_uid: "{{ ansible_user_uid }}"
      docker_gid: "{{ ansible_user_gid }}"
  tasks:
    - name: Create source and deployed stack roots
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks"
        - "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/stale-app"
        - "{{ lxc_docker_environment_internal.stacks_source }}/myapp/docs"

    - name: Seed desired stack compose source
      ansible.builtin.copy:
        dest: "{{ lxc_docker_environment_internal.stacks_source }}/myapp/compose.yaml"
        mode: "0644"
        content: |
          services:
            app:
              image: myapp:latest

    - name: Seed parseable stack metadata that must stay repo-only
      ansible.builtin.copy:
        dest: "{{ myapp_source }}/stack.yaml"
        mode: "0644"
        content: "kind: stack\n"

    - name: Seed stack-local docs and other metadata, plus an ordinary deployable config file
      ansible.builtin.command:
        argv: "{{ ['touch'] + (repo_only_stack_files + ['config.ini']) | map('regex_replace', '^', myapp_source ~ '/') | list }}"
      changed_when: true

    - name: Seed stale deployed stack compose file
      ansible.builtin.copy:
        dest: "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/stale-app/compose.yaml"
        mode: "0644"
        content: |
          services:
            old:
              image: old:latest

    - name: Place mock docker script on PATH
      ansible.builtin.copy:
        dest: "{{ temp_root }}/docker"
        mode: "0755"
        content: |
          #!/bin/sh
          printf '%s | %s\n' "$PWD" "$*" >> "{{ temp_root }}/docker-calls.log"
          case "$1 $2" in
            "network create")
              if [ -e "{{ temp_root }}/proxy-network" ]; then
                echo "network already exists" >&2
                exit 1
              fi
              touch "{{ temp_root }}/proxy-network"
              ;;
            "compose up")
              if [ -e "{{ temp_root }}/myapp-running" ]; then
                echo "Running" >&2
              else
                touch "{{ temp_root }}/myapp-running"
                echo "Started" >&2
              fi
              ;;
            "image prune")
              echo "Total reclaimed space: 0B"
              ;;
          esac
          exit 0

    - name: Include stack sync main with mock docker on PATH
      environment:
        PATH: "{{ temp_root }}:{{ lookup('env', 'PATH') }}"
      block:
        - name: Include stack sync main tasks
          ansible.builtin.include_role:
            name: config/lxc_stack_sync

    - name: Read docker call log
      ansible.builtin.slurp:
        src: "{{ temp_root }}/docker-calls.log"
      register: _docker_log

    - name: Assert deployment report has exactly the supported fields and outcomes
      ansible.builtin.assert:
        that:
          - lxc_docker_env_deployment_report == expected_report
        fail_msg: "Final deployment report did not reflect the expected reconciliation outcome"
      vars:
        expected_report:
          changed: true
          discovered_stacks: [myapp]
          quarantined_stacks: [stale-app]
          skipped_stacks: []

    - name: Assert docker commands covered quarantine and startup
      ansible.builtin.assert:
        that:
          - >-
            (lxc_docker_environment_internal.shared_mount_source ~ '/stacks/stale-app | compose down --remove-orphans')
            in (_docker_log.content | b64decode)
          - "'network create proxy' in (_docker_log.content | b64decode)"
          - >-
            (lxc_docker_environment_internal.shared_mount_source ~ '/stacks/myapp | compose up -d')
            in (_docker_log.content | b64decode)
          - (_docker_log.content | b64decode).splitlines() | select('search', 'compose down') | list | length == 1
        fail_msg: "Expected docker to stop only the stale stack and start the desired stack"

    - name: Read quarantined compose file
      ansible.builtin.slurp:
        src: >-
          {{ lxc_docker_environment_internal.stale_stack_quarantine_root
          }}/stale-app-{{ ansible_date_time.iso8601_basic_short }}/compose.yaml
      register: _quarantined_compose

    - name: Check original stale stack location
      ansible.builtin.stat:
        path: "{{ lxc_docker_environment_internal.shared_mount_source }}/stacks/stale-app"
      register: _stale_stack

    - name: Assert quarantine moved the stale stack and preserved its contents
      ansible.builtin.assert:
        that:
          - not _stale_stack.stat.exists
          - (_quarantined_compose.content | b64decode | from_yaml).services.old.image == 'old:latest'

    # Deployed tree: deployable files arrive while stack-local docs and metadata stay repo-only.
    - name: Find the deployed desired stack tree
      ansible.builtin.find:
        paths: "{{ deployed_myapp }}"
        recurse: true
        hidden: true
        file_type: any
      register: _deployed_myapp_tree

    - name: Assert deployable files arrived and repo-only files did not
      ansible.builtin.assert:
        that:
          - "['compose.yaml', 'config.ini'] | difference(deployed_files) == []"
          - "(['docs', 'stack.yaml'] + repo_only_stack_files) | intersect(deployed_files) == []"
      vars:
        deployed_files: "{{ _deployed_myapp_tree.files | map(attribute='path') | map('relpath', deployed_myapp) | list }}"

    - name: Reconcile again with the same desired and converged Docker state
      environment:
        PATH: "{{ temp_root }}:{{ lookup('env', 'PATH') }}"
      block:
        - name: Include stack sync main tasks for the second apply
          ansible.builtin.include_role:
            name: config/lxc_stack_sync

    - name: Assert converged second apply reports no change or repeated quarantine
      ansible.builtin.assert:
        that:
          - lxc_docker_env_deployment_report == expected_report
      vars:
        expected_report:
          changed: false
          discovered_stacks: [myapp]
          quarantined_stacks: []
          skipped_stacks: []

    - name: Read Docker calls before check mode
      ansible.builtin.slurp:
        src: "{{ temp_root }}/docker-calls.log"
      register: _docker_log_before_check

    - name: Reconcile converged stacks in check mode
      check_mode: true
      environment:
        PATH: "{{ temp_root }}:{{ lookup('env', 'PATH') }}"
      block:
        - name: Include stack sync main tasks in check mode
          ansible.builtin.include_role:
            name: config/lxc_stack_sync

    - name: Read Docker calls after check mode
      ansible.builtin.slurp:
        src: "{{ temp_root }}/docker-calls.log"
      register: _docker_log_after_check

    - name: Assert check mode reports skipped stack commands without running Docker
      ansible.builtin.assert:
        that:
          - lxc_docker_env_deployment_report == expected_report
          - _docker_log_after_check.content == _docker_log_before_check.content
      vars:
        expected_report:
          changed: false
          discovered_stacks: [myapp]
          quarantined_stacks: []
          skipped_stacks: [myapp]

    - name: Find quarantine destinations after apply, converged apply, and check mode
      ansible.builtin.find:
        paths: "{{ lxc_docker_environment_internal.stale_stack_quarantine_root }}"
        file_type: directory
      register: _quarantine_destinations

    - name: Assert the stale stack was quarantined to exactly one destination
      ansible.builtin.assert:
        that:
          - _quarantine_destinations.files | map(attribute='path') | map('basename') | list
            == ['stale-app-' ~ ansible_date_time.iso8601_basic_short]
