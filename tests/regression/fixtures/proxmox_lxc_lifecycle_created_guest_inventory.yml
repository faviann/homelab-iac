---
# Two guests the lifecycle creates in one run. Each inventory address is a name
# no resolver answers, as the LAN resolver leaves a fresh lease's name for
# minutes. The first guest obtains 127.0.0.1, where the launcher's sshd trusts
# the fixture controller identity; the second never obtains an address.
all:
  vars:
    proxmox_api_host: localhost
    proxmox_api_user: fixture@pam
    proxmox_api_token_id: fixture
    proxmox_api_token_secret: "controlled-api-token"
    proxmox_verify_ssl: false
    proxmox_validate_pct: false
  children:
    lxcs:
      vars:
        ansible_connection: ssh
        ansible_port: "{{ lifecycle_ssh_port }}"
        ansible_user: "{{ lifecycle_ssh_user }}"
        ansible_ssh_private_key_file: "~/.ansible/ssh/proxmox_lxc"
        # Keeps the operator's ssh_config and known_hosts out of the run.
        ansible_ssh_common_args: -F /dev/null -o UserKnownHostsFile=/dev/null
        proxmox_skip_self: false
        proxmox_lxc_controller_pubkey_enabled: false
        proxmox_lxc_host_config_enabled: true
        proxmox_lxc_host_config_become: false
        proxmox_lxc_host_config_path_root: "{{ lifecycle_test_state_dir }}"
        proxmox_pct_delegate_host: localhost
        proxmox_api_delegate_host: localhost
        proxmox_default_storage: local-lvm
        proxmox_default_bind_mounts: {}
        proxmox_default_idmap: []
        proxmox_lxc_disable_root_password: true
        proxmox_lifecycle_intent: full
        # The lxc-info double answers the first address query empty.
        proxmox_lifecycle_guest_address_retries: 2
        proxmox_lifecycle_guest_address_delay: 0
        proxmox_lifecycle_policy:
          strict_validation: false
          rebuild_on_release_mismatch: false
          allow_destructive_transitions: false
        proxmox_fleet_preflight_enabled: false
      hosts:
        created_guest:
          ansible_host: created-guest.invalid
          proxmox_lxc:
            state: present
            vmid: 7301
            hostname: created-guest
            node: pve-a
            ostemplate: local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst
            cores: 1
            memory: 128
            disk: 4
            netif:
              net0: name=eth0,bridge=vmbr0,ip=dhcp
            pubkey: ssh-ed25519 AAAAACREATED lifecycle@test
        created_guest_without_address:
          ansible_host: created-guest-without-address.invalid
          proxmox_lxc:
            state: present
            vmid: 7302
            hostname: created-guest-without-address
            node: pve-a
            ostemplate: local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst
            cores: 1
            memory: 128
            disk: 4
            netif:
              net0: name=eth0,bridge=vmbr0,ip=dhcp
            pubkey: ssh-ed25519 AAAAACREATED lifecycle@test
