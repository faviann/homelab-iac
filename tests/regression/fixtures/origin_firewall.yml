---
- name: Test the origin firewall role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: >-
      {{ playbook_dir }}/origin_firewall_assets/python-module-wrapper
    lxc_origin_firewall_enabled: true
    lxc_origin_firewall_protected_ports:
      - 4001
      - 9119
      - 18789
      - 8788
    lxc_origin_firewall_allowed_hosts:
      - portal
    lxc_origin_firewall_nft_dir: "{{ temp_root }}/etc/nftables.d"
    lxc_origin_firewall_nft_path: "{{ lxc_origin_firewall_nft_dir }}/custom-origin.nft"
    lxc_origin_firewall_service_path: >-
      {{ temp_root }}/etc/systemd/system/custom-origin-firewall.service
  tasks:
    - name: Ensure temporary systemd directory exists
      ansible.builtin.file:
        path: "{{ lxc_origin_firewall_service_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Include the origin firewall role
      ansible.builtin.include_role:
        name: config/lxc_origin_firewall
