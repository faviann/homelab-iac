---
- name: Validate workstation first-login setup contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # True runs the whole baseline role and verifies the setup contract.
    # False renders only the first-login artifacts, for behavioral scenarios
    # that exercise the rendered files themselves.
    first_login_full_role: true
    role_root: "{{ playbook_dir }}/../../../playbooks/roles/config/lxc_workstation_baseline"
    workstation_username: "{{ lookup('pipe', 'id -un') }}"
    workstation_uid: "{{ lookup('pipe', 'id -u') | int }}"
    workstation_gid: "{{ lookup('pipe', 'id -g') | int }}"
    workstation_home: "{{ temp_root }}/home/{{ workstation_username }}"
    workstation_marker: "{{ workstation_home }}/.local/state/workstation-setup/complete"
    workstation_origin_firewall_nft_dir: "{{ temp_root }}/etc/nftables.d"
    workstation_origin_firewall_service_path: "{{ temp_root }}/etc/systemd/system/workstation-origin-firewall.service"
    workstation_packages: []
    workstation_locale_enabled: false
    workstation_chezmoi_install_enabled: false
    workstation_persistent_home_enabled: false
    workstation_nix_install_enabled: false
    workstation_enable_linger: false
    workstation_bw_bin_path: "{{ temp_root }}/bin/bw"
    workstation_setup_bin_path: "{{ temp_root }}/bin/workstation-setup"
    workstation_setup_profile_hook_path: "{{ temp_root }}/etc/profile.d/workstation-setup.sh"
    workstation_update_requires_bitwarden: true
    workstation_system_bin_owner: "{{ lookup('pipe', 'id -un') }}"
    workstation_system_bin_group: "{{ lookup('pipe', 'id -gn') }}"
    lxc_ssh_user: "{{ workstation_username }}"
    lxc_ssh_uid: "{{ workstation_uid }}"
    lxc_ssh_gid: "{{ workstation_gid }}"
    lxc_github_keys_home: "{{ workstation_home }}"
    lxc_github_users:
      - faviann
    docker_user: "{{ workstation_username }}"
    docker_uid: "{{ workstation_uid }}"
    docker_gid: "{{ workstation_gid }}"
  tasks:
    - name: Ensure writable test directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ temp_root }}/bin"
        - "{{ temp_root }}/etc/profile.d"
        - "{{ workstation_home }}"

    - name: Place mock curl on PATH
      ansible.builtin.copy:
        dest: "{{ temp_root }}/curl"
        mode: "0755"
        content: |
          #!/bin/sh
          case "$*" in
            *faviann.keys*)
              printf '%s\n' 'ssh-ed25519 AAAATESTKEYONE faviann@laptop'
              ;;
            *get.chezmoi.io*)
              printf '%s\n' '#!/bin/sh' 'exit 0'
              ;;
            *)
              exit 0
              ;;
          esac

    - name: Include workstation baseline role with PATH mocks
      environment:
        PATH: "{{ temp_root }}:{{ lookup('env', 'PATH') }}"
      when: first_login_full_role | bool
      block:
        - name: Include workstation baseline role
          ansible.builtin.include_role:
            name: config/lxc_workstation_baseline

    - name: Install first-login artifacts through the production role seam
      ansible.builtin.include_role:
        name: config/lxc_workstation_baseline
        tasks_from: first_login.yml
      when: not (first_login_full_role | bool)

    - name: Verify the first-login setup contract
      when: first_login_full_role | bool
      block:
        - name: Stat workstation setup command
          ansible.builtin.stat:
            path: "{{ workstation_setup_bin_path }}"
          register: setup_command_stat

        - name: Stat workstation setup login hook
          ansible.builtin.stat:
            path: "{{ workstation_setup_profile_hook_path }}"
          register: setup_hook_stat

        - name: Read workstation setup command
          ansible.builtin.slurp:
            src: "{{ workstation_setup_bin_path }}"
          register: setup_command_raw

        - name: Read workstation setup login hook
          ansible.builtin.slurp:
            src: "{{ workstation_setup_profile_hook_path }}"
          register: setup_hook_raw

        - name: Syntax-check workstation setup command
          ansible.builtin.command:
            cmd: "bash -n {{ workstation_setup_bin_path }}"
          changed_when: false

        - name: Syntax-check workstation setup login hook
          ansible.builtin.command:
            cmd: "bash -n {{ workstation_setup_profile_hook_path }}"
          changed_when: false

        - name: Assert first-login artifacts are installed for the login user
          ansible.builtin.assert:
            that:
              - setup_command_stat.stat.exists
              - setup_command_stat.stat.uid == workstation_uid
              - setup_command_stat.stat.gid == workstation_gid
              - setup_command_stat.stat.mode == "0755"
              - setup_hook_stat.stat.exists
              - setup_hook_stat.stat.uid == workstation_uid
              - setup_hook_stat.stat.gid == workstation_gid
              - setup_hook_stat.stat.mode == "0644"
            fail_msg: >-
              The setup command must be executable and the login hook only
              sourced, both owned by the login user.

        # What only the rendered artifacts can show: every variable resolved,
        # to the right value, without interpolating a Bitwarden credential.
        # The scripts' own content is asserted against the templates in
        # tests/unit/test_workstation_baseline_role.py, and their behavior by
        # the scenarios in this file's test module.
        - name: Assert the rendered artifacts resolved every template variable
          ansible.builtin.assert:
            that:
              - not ((setup_command_raw.content | b64decode) is search('{{ "{{" }}'))
              - not ((setup_hook_raw.content | b64decode) is search('{{ "{{" }}'))
            fail_msg: Rendering left an unresolved template expression behind.

        - name: Assert the setup command resolved its workstation identity
          ansible.builtin.assert:
            that:
              - (setup_command_raw.content | b64decode) is search('WORKSTATION_HOME="' ~ workstation_home ~ '"')
              - (setup_command_raw.content | b64decode) is search('BW_BIN="' ~ workstation_bw_bin_path ~ '"')
              - (setup_command_raw.content | b64decode) is search('MARKER_PATH="' ~ workstation_marker ~ '"')
              - (setup_command_raw.content | b64decode) is search('GITHUB_CLI_TOKEN_ITEM="dotfiles/github-cli-token"')
              - (setup_command_raw.content | b64decode) is search('SETUP_VERSION="2"')

        - name: Assert the login hook resolved to the artifacts it must drive
          ansible.builtin.assert:
            that:
              # The hook is never executed by the behavioral scenarios, so this
              # is the only check that it points at the command it offers to run.
              - (setup_hook_raw.content | b64decode) is search('"' ~ workstation_setup_bin_path ~ '"')
              - (setup_hook_raw.content | b64decode) is search('export PATH="' ~ workstation_home ~ '/.local/bin:'
                ~ workstation_home ~ '/.nix-profile/bin:/nix/var/nix/profiles/default/bin:')
              # The hook reads the marker the setup command writes, so both
              # must agree on the version line or the prompt never stops.
              - (setup_hook_raw.content | b64decode) is search('version=2')
              - (setup_hook_raw.content | b64decode) is search('"' ~ workstation_marker ~ '"')

        - name: Assert no Bitwarden credential reached the rendered artifacts
          ansible.builtin.assert:
            that:
              - not ((setup_command_raw.content | b64decode) is search('BW_CLIENTID'))
              - not ((setup_command_raw.content | b64decode) is search('BW_CLIENTSECRET'))
              - not ((setup_command_raw.content | b64decode) is search('WORKSTATION_BW_'))
              - not ((setup_hook_raw.content | b64decode) is search('BW_CLIENTID'))
              - not ((setup_hook_raw.content | b64decode) is search('BW_CLIENTSECRET'))
            fail_msg: >-
              A rendered first-login artifact carries a Bitwarden credential.
