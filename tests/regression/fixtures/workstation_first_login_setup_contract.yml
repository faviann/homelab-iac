---
# Renders the first-login artifacts through the role's own task file and checks
# what only rendering can show. The whole-role run in workstation_baseline_test.yml
# proves the baseline installs them.
- name: Validate workstation first-login setup contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    workstation_username: "{{ lookup('pipe', 'id -un') }}"
    workstation_uid: "{{ lookup('pipe', 'id -u') | int }}"
    workstation_gid: "{{ lookup('pipe', 'id -g') | int }}"
    workstation_home: "{{ temp_root }}/home/{{ workstation_username }}"
    workstation_marker: "{{ workstation_home }}/.local/state/workstation-setup/complete"
    workstation_bw_bin_path: "{{ temp_root }}/bin/bw"
    workstation_setup_bin_path: "{{ temp_root }}/bin/workstation-setup"
    workstation_setup_profile_hook_path: "{{ temp_root }}/etc/profile.d/workstation-setup.sh"
    workstation_update_requires_bitwarden: true
    workstation_system_bin_owner: "{{ lookup('pipe', 'id -un') }}"
    workstation_system_bin_group: "{{ lookup('pipe', 'id -gn') }}"
  tasks:
    - name: Ensure writable test directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ temp_root }}/bin"
        - "{{ temp_root }}/etc/profile.d"
        - "{{ workstation_home }}"

    - name: Install first-login artifacts through the production role seam
      ansible.builtin.include_role:
        name: config/lxc_workstation_baseline
        tasks_from: first_login.yml

    - name: Verify the first-login setup contract
      block:
        - name: Stat workstation setup command
          ansible.builtin.stat:
            path: "{{ workstation_setup_bin_path }}"
          register: setup_command_stat

        - name: Stat workstation setup login hook
          ansible.builtin.stat:
            path: "{{ workstation_setup_profile_hook_path }}"
          register: setup_hook_stat

        - name: Read workstation setup command
          ansible.builtin.slurp:
            src: "{{ workstation_setup_bin_path }}"
          register: setup_command_raw

        - name: Read workstation setup login hook
          ansible.builtin.slurp:
            src: "{{ workstation_setup_profile_hook_path }}"
          register: setup_hook_raw

        - name: Syntax-check workstation setup command
          ansible.builtin.command:
            cmd: "bash -n {{ workstation_setup_bin_path }}"
          changed_when: false

        - name: Syntax-check workstation setup login hook
          ansible.builtin.command:
            cmd: "bash -n {{ workstation_setup_profile_hook_path }}"
          changed_when: false

        # The fixture points workstation_system_bin_owner at the test user;
        # production installs both as root. What matters either way is that the
        # configured owner gets an executable command and a sourced-only hook.
        - name: Assert first-login artifacts are installed for the configured owner
          ansible.builtin.assert:
            that:
              - setup_command_stat.stat.exists
              - setup_command_stat.stat.uid == workstation_uid
              - setup_command_stat.stat.gid == workstation_gid
              - setup_command_stat.stat.mode == "0755"
              - setup_hook_stat.stat.exists
              - setup_hook_stat.stat.uid == workstation_uid
              - setup_hook_stat.stat.gid == workstation_gid
              - setup_hook_stat.stat.mode == "0644"
            fail_msg: >-
              The setup command must be executable and the login hook only
              sourced, both owned by workstation_system_bin_owner.

        # What only the rendered artifacts can show: every variable resolved,
        # and resolved to the right value. The scripts' own text is asserted
        # against the templates in tests/unit/test_workstation_baseline_role.py,
        # and their runtime behavior by the scenarios in
        # tests/regression/test_workstation_first_login_setup_contract.py.
        - name: Assert the rendered artifacts resolved every template variable
          ansible.builtin.assert:
            that:
              - not ((setup_command_raw.content | b64decode) is search('{{ "{{" }}'))
              - not ((setup_hook_raw.content | b64decode) is search('{{ "{{" }}'))
            fail_msg: Rendering left an unresolved template expression behind.

        - name: Assert the setup command resolved its workstation identity
          ansible.builtin.assert:
            that:
              - (setup_command_raw.content | b64decode) is search('WORKSTATION_HOME="' ~ workstation_home ~ '"')
              - (setup_command_raw.content | b64decode) is search('BW_BIN="' ~ workstation_bw_bin_path ~ '"')
              - (setup_command_raw.content | b64decode) is search('MARKER_PATH="' ~ workstation_marker ~ '"')
              - (setup_command_raw.content | b64decode) is search('GITHUB_CLI_TOKEN_ITEM="dotfiles/github-cli-token"')
              - (setup_command_raw.content | b64decode) is search('SETUP_VERSION="2"')

        # test_workstation_first_login_setup_contract sources the hook, which
        # covers the paths it resolves: naming the wrong setup command, the
        # wrong marker, or a marker version the setup command does not write
        # all fail there. The login PATH is the one thing sourcing does not
        # check, because none of those assertions depend on it.
        - name: Assert the login hook exports the workstation login PATH
          ansible.builtin.assert:
            that:
              - (setup_hook_raw.content | b64decode) is search('export PATH="' ~ workstation_home ~ '/.local/bin:'
                ~ workstation_home ~ '/.nix-profile/bin:/nix/var/nix/profiles/default/bin:')
