---
x-prereq-dirs:
  - ./appdata/navidrome

# Python loads the script once; the loop never re-reads it.
x-restart-on-change:
  reconciler:
    - ./reconciler/reconciler.py

services:
  navidrome:
    image: deluan/navidrome:latest@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "4533:4533"
    environment:
      TZ: ${TZ}
      ND_MUSICFOLDER: ${ND_MUSICFOLDER}
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_EXTAUTH_TRUSTEDSOURCES: ${ND_EXTAUTH_TRUSTEDSOURCES}
      ND_EXTAUTH_USERHEADER: X-authentik-username
      ND_ENABLEUSEREDITING: "false"
    volumes:
      - ./appdata/navidrome:/data
      - ${MUSIC_LIBRARY_PATH}:${ND_MUSICFOLDER}:ro
    labels:
      traefik.enable: true
      traefik.http.routers.music-public.rule: Host(`music.public.faviann.com`)
      traefik.http.routers.music-public.service: music
      traefik.http.routers.music-browser.rule: Host(`music.media.faviann.com`)
      traefik.http.routers.music-browser.middlewares: protected-edge-auth@file
      traefik.http.routers.music-browser.service: music
      traefik.http.services.music.loadbalancer.server.port: "4533"
      homepage.group: Media
      homepage.name: Navidrome
      homepage.href: https://${HOMEPAGE_FQDN}
      homepage.description: Music streaming server
      homepage.icon: navidrome

  reconciler:
    image: python:3.15-slim@sha256:2da676046630d7bf14c6764ae1143dc7fa0377a53f94bf5a642f0b214aca5bce
    container_name: navidrome-reconciler
    restart: unless-stopped
    depends_on:
      - navidrome
    environment:
      AUTHENTIK_URL: ${AUTHENTIK_URL}
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN}
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_ADMIN_USER: ${NAVIDROME_ADMIN_USER}
      NAVIDROME_ADMIN_PASSWORD: ${NAVIDROME_ADMIN_PASSWORD}
      SYNC_INTERVAL_SECONDS: "600"
    volumes:
      - ./reconciler:/app:ro
    command: python /app/reconciler.py
