---
x-prereq-dirs:
  - ./appdata/config
  - ./appdata/metadata

services:
  audiobookshelf:
    image: advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ./appdata/config:/config
      - ./appdata/metadata:/metadata
      - /data/media/audiobooks:/audiobooks:ro
    ports:
      - "13378:80"
    labels:
      traefik.enable: true
      traefik.http.services.audiobookshelf.loadbalancer.server.port: 13378
      homepage.group: Media
      homepage.name: Audiobookshelf
      homepage.icon: audiobookshelf
      homepage.href: https://${HOMEPAGE_FQDN}
      homepage.description: Audiobook server
