---
services:
  komga:
    image: gotson/komga:1.29.1@sha256:9fa656e8259bbd75c0f654bdfa91abf2b4813cbf4f40e80eb292495446ffdf1f
    container_name: komga
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      SERVER_PORT: ${SERVER_PORT}
    volumes:
      - ./appdata/config:/config
      - /data/media/comics:/data/media/comics
      - /data/media/manga:/data/media/manga
    ports:
      - "25600:25600"
    labels:
      traefik.enable: true
      homepage.group: Media
      homepage.name: Komga
      homepage.icon: komga
      homepage.href: https://${HOMEPAGE_FQDN}
      homepage.description: Manga reading server
