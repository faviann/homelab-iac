---
x-prereq-dirs:
  - ./appdata/mealie

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
    container_name: mealie
    restart: unless-stopped
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ./appdata/mealie:/app/data
    environment:
      - ALLOW_SIGNUP=false
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BASE_URL=${BASE_URL}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - DEFAULT_EMAIL=${DEFAULT_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAX_WORKERS=${MAX_WORKERS}
      - OIDC_AUTH_ENABLED=${OIDC_AUTH_ENABLED}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME}
      - OIDC_CONFIGURATION_URL=${OIDC_CONFIGURATION_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REMEMBER_ME=${OIDC_REMEMBER_ME}
    labels:
      traefik.enable: true
      homepage.group: Home
      homepage.name: ${COMPOSE_PROJECT_NAME}
      homepage.icon: mealie
      homepage.href: https://${HOMEPAGE_FQDN}
      homepage.description: Recipe manager
