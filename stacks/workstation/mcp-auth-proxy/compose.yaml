---
x-prereq-dirs:
  - ./appdata/data

services:
  mcp-auth-proxy:
    image: ghcr.io/sigbit/mcp-auth-proxy:v2.10.2@sha256:f92e0ccd22b2a7585bccedc366a3c872bbfa3500c7fa5e7443b40962bf248e8d
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command:
      - http://127.0.0.1:8080
    volumes:
      - ./appdata/data:/data
