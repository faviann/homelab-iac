---
x-prereq-dirs:
  - ./appdata/data

services:
  mcp-auth-proxy:
    image: ghcr.io/sigbit/mcp-auth-proxy:v2.10.6@sha256:7ac262c534e1a85638446703795a600a60914f7310f027e945a60a30a21f3764
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command:
      - http://127.0.0.1:8080
    volumes:
      - ./appdata/data:/data
