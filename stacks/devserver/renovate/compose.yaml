---
# Long-running Renovate against this repository; the repository config,
# including the weekly Saturday window, is renovate.json at the repo root.
# The command loops under the image's own entrypoint: run Renovate, sleep six
# hours, repeat. A failed run does not end the loop. A start or restart runs
# immediately. Sleeping in the background lets the TERM trap stop the
# container at once instead of after Docker's 10-second kill timeout.
services:
  renovate:
    image: ghcr.io/renovatebot/renovate:44.132.4
    container_name: renovate
    restart: unless-stopped
    command: ["bash", "-c", "trap exit TERM; while :; do renovate; sleep 21600 & wait; done"]
    env_file:
      - .env
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: faviann/homelab-iac
      # Renovate runs no post-upgrade task unless it matches this list. The
      # vendor sync is the only task renovate.json declares.
      RENOVATE_ALLOWED_COMMANDS: >-
        ["^sh scripts/vendor-sync\\.sh stacks/[a-z0-9/_-]+/compose\\.yaml [A-Za-z0-9._-]+ [A-Za-z0-9._-]+$$"]
      LOG_LEVEL: info
