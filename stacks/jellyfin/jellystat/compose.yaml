---
x-prereq-dirs:
  - ./appdata/jellystat-db/config
  - ./appdata/jellystat-db/data
  - ./appdata/jellystat

services:
  jellystat-db:
    image: postgres:15.19@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
    container_name: jellystat-db
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./appdata/jellystat-db/config:/config
      - ./appdata/jellystat-db/data:/var/lib/postgresql/data
  jellystat:
    image: cyfershepard/jellystat:1.1.12@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
    container_name: jellystat
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=${TZ}
    volumes:
      - ./appdata/jellystat:/app/backend/backup-data
    ports:
      - 3000:3000
    labels:
      traefik.enable: true
      traefik.http.routers.jellystat.middlewares: protected-edge-auth@file
      homepage.group: Media
      homepage.name: ${COMPOSE_PROJECT_NAME}
      homepage.icon: mdi-chart-line
      homepage.href: https://${HOMEPAGE_FQDN}
      homepage.description: Jellyfin analytics
    depends_on:
      - jellystat-db
