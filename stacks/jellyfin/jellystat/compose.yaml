---
x-prereq-dirs:
  - ./appdata/jellystat-db/config
  - ./appdata/jellystat-db/data
  - ./appdata/jellystat

services:
  jellystat-db:
    image: postgres:15.20@sha256:868b5ee219026c0f34c99d696d4494ccb3705cf1a18bed1e0b9de64d9c011ccd
    container_name: jellystat-db
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./appdata/jellystat-db/config:/config
      - ./appdata/jellystat-db/data:/var/lib/postgresql/data
  jellystat:
    image: cyfershepard/jellystat:1.1.12@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
    container_name: jellystat
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=${TZ}
    volumes:
      - ./appdata/jellystat:/app/backend/backup-data
    ports:
      - 3000:3000
    labels:
      traefik.enable: true
      traefik.domain: admin.faviann.com
      traefik.http.routers.jellystat.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Media Management
      homepage.instance.admin.name: Jellystat
      homepage.instance.admin.icon: mdi-chart-line
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Jellyfin analytics
    depends_on:
      - jellystat-db
