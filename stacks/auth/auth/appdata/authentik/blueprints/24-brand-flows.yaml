      @media (prefers-reduced-motion: reduce) {
        html:has(ak-flow-executor)::before,
        html:has(ak-flow-executor)::after,
        html:has(ak-flow-executor) body::before {
          animation: none;
        }
        html:has(ak-flow-executor) body::after {
          display: none;
        }
      }

      /* Make the starfield win over VULGA on flow pages: drop the flow
         background image so nothing paints over the sky, and turn VULGA's
         full-screen body::before (and its mobile blur variant) back into the
         1px twinkle-star carrier. The .pf-c-login form outranks VULGA's
         body:has(.pf-c-login)::before on compatibility-mode flows. */
      :root:has(ak-flow-executor) {
          --ak-flow-background: none;
      }

      html:has(ak-flow-executor) body::before,
      html:has(.pf-c-login) body::before {
          top: 0 !important;
          left: 0 !important;
          right: auto !important;
          bottom: auto !important;
          width: 1px !important;
          height: 1px !important;
          border-radius: 50% !important;
          background: transparent !important;
          filter: none !important;
          -webkit-filter: none !important;
          z-index: -1 !important;
      }

      /* Livelier starfield: faster drift so the two layers read as parallax
         (25 and 50 px/s), and a shooting star every 6s on paths beside the card
         instead of three per 48s with one hidden behind it. Durations only, so
         the wide-screen keyframes and the reduced-motion "animation: none"
         above still apply. */
      html:has(ak-flow-executor)::before {
          animation-duration: 60s;
      }

      html:has(ak-flow-executor)::after {
          animation-duration: 30s;
      }

      html:has(ak-flow-executor) body::before {
          animation-duration: 60s, 7s;
      }

      html:has(ak-flow-executor) body::after {
          animation-name: sf-shoot-sides;
          animation-duration: 18s;
          animation-delay: 1.5s;
      }

      @keyframes sf-shoot-sides {
          0%          { transform: translate(90vw, 12vh) rotate(-28deg) translateX(0); opacity: 0; animation-timing-function: ease-out; }
          1.5%        { opacity: 1; }
          8%          { transform: translate(90vw, 12vh) rotate(-28deg) translateX(-480px); opacity: 0; }
          8.01%, 33%  { transform: translate(24vw, 8vh) rotate(-38deg) translateX(0); opacity: 0; animation-timing-function: ease-out; }
          34.5%       { opacity: 1; }
          41%         { transform: translate(24vw, 8vh) rotate(-38deg) translateX(-420px); opacity: 0; }
          41.01%, 66% { transform: translate(99vw, 58vh) rotate(-16deg) translateX(0); opacity: 0; animation-timing-function: ease-out; }
          67.5%       { opacity: 1; }
          75%, 100%   { transform: translate(99vw, 58vh) rotate(-16deg) translateX(-460px); opacity: 0; }
      }
