        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 160px;
        height: 4px;
        pointer-events: none;
        z-index: -1;
        opacity: 0;
        background:
          radial-gradient(circle at 2px 50%, #fff 0 1.6px, transparent 2.6px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(180, 200, 255, 0.3) 30%, transparent) center / 100% 1.5px no-repeat;
        filter: drop-shadow(0 0 4px rgba(190, 210, 255, 0.9));
        transform-origin: 2px 50%;
        animation: sf-shoot 48s linear 6s infinite;
      }

