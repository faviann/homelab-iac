      /* ===== NEW AUTHENTIK BACKGROUND OVERLAY FIX ===== */
      /* The authentik update added a fixed full-viewport "background-wrapper" holding a
         "background-default-slant" element (an opaque gray slant). On the user/library
         pages this sat ON TOP of our theme background, hiding it (background looked cut
         in half / gray on the top area). Make these new parts transparent so the theme
         background image shows through everywhere, including under the transparent header. */
      [part="background-wrapper"],
      [part="background-default-slant"],
      ::part(background-wrapper),
      ::part(background-default-slant) {
          background: transparent !important;
          background-color: transparent !important;
          background-image: none !important;
