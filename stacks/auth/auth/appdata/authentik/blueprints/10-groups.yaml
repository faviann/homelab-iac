version: 1
metadata:
  name: repo-auth-groups
  labels:
    blueprints.goauthentik.io/instantiate: 'false'
    blueprints.goauthentik.io/description: Managed from ServerManagementScripts
entries:
- model: authentik_core.group
  state: absent
  identifiers:
    name: admin
- model: authentik_core.group
  state: present
  identifiers:
    name: admins
  attrs:
    name: admins
- model: authentik_core.group
  state: present
  identifiers:
    name: ldapsearch
  attrs:
    name: ldapsearch
- model: authentik_core.group
  state: present
  identifiers:
    name: games
  attrs:
    name: games
- model: authentik_core.group
  state: present
  identifiers:
    name: household
  attrs:
    name: household
- model: authentik_core.group
  state: present
  identifiers:
    name: media
  attrs:
    name: media
- model: authentik_core.group
  state: present
  identifiers:
    name: photos
  attrs:
    name: photos
- model: authentik_core.group
  state: present
  identifiers:
    name: PVEAdmins
  attrs:
    name: PVEAdmins
- model: authentik_core.group
  state: present
  identifiers:
    name: reading
  attrs:
    name: reading
- model: authentik_core.group
  state: absent
  identifiers:
    name: storage
- model: authentik_core.group
  state: present
  identifiers:
    name: family
  attrs:
    name: family
    parents:
    - !Find [authentik_core.group, [name, games]]
    - !Find [authentik_core.group, [name, household]]
    - !Find [authentik_core.group, [name, media]]
    - !Find [authentik_core.group, [name, photos]]
    - !Find [authentik_core.group, [name, reading]]
