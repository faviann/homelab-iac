# Web fetchers such as ChatGPT's reject text/markdown. The glob is
# case-sensitive while the server's MIME detection is not, so match every case.
[[advanced.headers]]
source = "**/*.[mM][dD]"
headers = { Content-Type = "text/plain; charset=utf-8" }

# Publications rewrite files under latest/ in place on every republish, so a
# browser must revalidate them. This replaces the server's built-in max-age.
[[advanced.headers]]
source = "**/latest/**"
headers = { Cache-Control = "no-cache" }
