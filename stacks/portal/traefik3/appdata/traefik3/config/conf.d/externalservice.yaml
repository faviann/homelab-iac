---
http:
  routers:

# --- SPECIFIC ROUTERS ---

    traefik:
      rule: "Host(`traefik.local.faviann.com`)"
      entryPoints: websecure
      service: api@internal
      priority: 1000
      middlewares:
        - local-ip-restriction

    proxmox:
      rule: "Host(`proxmox.local.faviann.com`)"
      entryPoints: websecure
      service: proxmoxve
      priority: 1000
      middlewares:
        - sslheader
        - local-ip-restriction

    aoe:
      rule: "Host(`aoe.local.faviann.com`)"
      entryPoints: websecure
      service: aoe-workstation
      priority: 1000
      middlewares:
        - local-ip-restriction

    # Admin-authenticated and deliberately reachable from outside the LAN, so no
    # local-ip-restriction. Anonymous and non-admin requests are stopped by the
    # shared admin-wildcard forward auth before any artifact byte is served.
    artifacts:
      rule: "Host(`artifacts.admin.faviann.com`)"
      entryPoints: websecure
      service: artifacts-workstation
      priority: 1000
      middlewares:
        - protected-edge-auth@file

    mcp-auth-proxy:
      rule: "Host(`mcp.faviann.com`) && (Path(`/mcp`) || PathPrefix(`/.well-known/`) || PathPrefix(`/.idp/`) || PathPrefix(`/.auth/`))"
      entryPoints: websecure
      service: mcp-auth-proxy-workstation
      priority: 1000

    # Lobu control plane. Deliberately has NO ForwardAuth/Authentik middleware:
    # Lobu runs its own OAuth 2.1 authorization server and ChatGPT's connector
    # onboarding needs unauthenticated dynamic client registration.
    #
    # The public surface is an explicit endpoint allowlist, not a namespace
    # allowlist. Lobu mounts Better Auth at /api/auth/*, which includes
    # organization management, member removal, password change and session
    # revocation; a PathPrefix there would publish all of it, and would publish
    # whatever Better Auth adds next. Only the two endpoints the OAuth sign-in
    # and consent screens actually call are listed. Signup is unreachable here
    # by construction, not by a deny rule.
    #
    # Everything else — the admin SPA at `/` and the `/api/<org>/*` workspace
    # API — falls through to the Authentik-protected `lobu-admin` router.
    lobu:
      rule: >-
        Host(`lobu.admin.faviann.com`) && (
        Path(`/mcp`)
        || PathPrefix(`/mcp/`)
        || Path(`/.well-known/oauth-protected-resource`)
        || PathPrefix(`/.well-known/oauth-protected-resource/`)
        || Path(`/.well-known/oauth-authorization-server`)
        || Path(`/.well-known/openid-configuration`)
        || Path(`/auth.md`)
        || Path(`/oauth/register`)
        || Path(`/oauth/authorize`)
        || Path(`/oauth/authorize/consent`)
        || Path(`/oauth/token`)
        || Path(`/oauth/revoke`)
        || Path(`/oauth/userinfo`)
        || Path(`/oauth/consent`)
        || Path(`/oauth/device`)
        || Path(`/oauth/device_authorization`)
        || Path(`/oauth/device/email`)
        || Path(`/oauth/device/info`)
        || Path(`/oauth/device/approve`)
        || PathPrefix(`/api/workers/`)
        || Path(`/api/me/devices`)
        || Path(`/api/me/devices/mint-child-token`)
        || Path(`/auth/login`)
        || Path(`/api/auth-config`)
        || Path(`/api/auth/get-session`)
        || Path(`/api/auth/sign-in/email`)
        || Path(`/api/organizations`)
        || PathPrefix(`/assets/`)
        || PathPrefix(`/fonts/`)
        || Path(`/favicon.ico`)
        || Path(`/favicon.svg`)
        || Path(`/apple-touch-icon.png`)
        || Path(`/site.webmanifest`)
        || Path(`/icon-192.png`)
        || Path(`/icon-512.png`)
        || Path(`/lobu-og.png`)
        || Path(`/owletto-mark.svg`)
        || Path(`/logo.png`)
        || Path(`/legal`)
        )
      entryPoints: websecure
      service: lobu
      priority: 1000

    # Lobu redirects browser traffic to PUBLIC_GATEWAY_URL, so its admin SPA is
    # only usable at the canonical origin (loopback aside). This lower-priority
    # catch-all serves it behind Authentik, so it is reachable from anywhere but
    # only by an authenticated admin. The shared admin-wildcard provider covers
    # this host, and authentik-outpost-admin-subdomains already routes its
    # callback, so no Lobu-specific Authentik object is needed.
    #
    # It cannot affect the machine-facing surface: every MCP, OAuth and worker
    # path is matched by the `lobu` router above at priority 1000, and Traefik
    # evaluates the higher priority first, so those requests never reach this
    # middleware. That separation is what #275 requires — an Authentik boundary
    # for the human admin UI only, never in front of the protocol endpoints.
    # This router picks up what the allowlist does not match: the admin SPA and
    # the /api/<org>/* workspace API.
    #
    # Same hostname on purpose: moving the admin SPA to its own host is what
    # risks breaking OAuth cookies and consent.
    lobu-admin:
      rule: "Host(`lobu.admin.faviann.com`)"
      entryPoints: websecure
      service: lobu
      priority: 900
      middlewares:
        - protected-edge-auth@file

    # Signup is enforced closed in the database (see the lobu stack's bootstrap
    # service). This denies it at the edge too, so the admin catch-all below
    # never carries an account-creation path even from a LAN or VPN source.
    # `noop` has no servers, so Traefik answers 503 without reaching Lobu.
    lobu-signup-denied:
      rule: "Host(`lobu.admin.faviann.com`) && PathPrefix(`/api/auth/sign-up`)"
      entryPoints: websecure
      service: noop
      priority: 1002

    hermes:
      rule: "Host(`hermes.local.faviann.com`)"
      entryPoints: websecure
      service: hermes-dashboard
      priority: 1000
      middlewares:
        - local-ip-restriction

    collie-auth-recovery:
      rule: "Host(`collie.admin.faviann.com`) && PathPrefix(`/auth/`)"
      entryPoints: websecure
      service: authentik
      priority: 1002
      middlewares:
        - local-ip-restriction
        - collie-auth-recovery

    collie:
      rule: "Host(`collie.admin.faviann.com`)"
      entryPoints: websecure
      service: collie-workstation
      priority: 1000
      middlewares:
        - local-ip-restriction
        - protected-edge-auth@file

    authentik-outpost-ai:
      rule: "Host(`ai.local.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    ai:
      rule: "Host(`ai.local.faviann.com`)"
      entryPoints: websecure
      service: openclaw-dashboard
      priority: 1000
      middlewares:
        - local-ip-restriction
        - protected-edge-auth@file
        - openclaw-operator-scopes

    # Authentik itself stays edge-open at Traefik so it can handle its own login
    # and callback flows without being wrapped by Traefik forwardAuth.
    authentik:
      rule: "Host(`auth.faviann.com`)"
      entryPoints: websecure
      service: authentik
      priority: 1000
      middlewares:
        - sslheader

    # Authentik outpost callback routers for the protected tiers that still use
    # edge forwardAuth. Public hosts do not use outpost callbacks by default.
    authentik-outpost-root:
      rule: "Host(`faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-admin:
      rule: "Host(`admin.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-admin-subdomains:
      rule: "HostRegexp(`^[a-z0-9-]+\\.admin\\.faviann\\.com$`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-home:
      rule: "Host(`home.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-home-subdomains:
      rule: "HostRegexp(`^[a-z0-9-]+\\.home\\.faviann\\.com$`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-media:
      rule: "Host(`media.faviann.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

    authentik-outpost-media-subdomains:
      rule: "HostRegexp(`^[a-z0-9-]+\\.media\\.faviann\\.com$`) && PathPrefix(`/outpost.goauthentik.io`)"
      entryPoints: websecure
      service: authentik
      priority: 1001
      middlewares:
        - sslheader

  services:
    proxmoxve:
      loadBalancer:
        servers:
          - url: "https://proxmox.lan:8006"
    aoe-workstation:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:4001"
    artifacts-workstation:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:19082"
    mcp-auth-proxy-workstation:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:19081"
    hermes-dashboard:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:9119"
    lobu:
      loadBalancer:
        servers:
          - url: "http://lobu.faviann.vms:8787"
    collie-workstation:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:8788"
    openclaw-dashboard:
      loadBalancer:
        servers:
          - url: "http://workstation.faviann.vms:18789"
    authentik:
      loadBalancer:
        servers:
          - url: "http://auth.faviann.vms:9000"
    noop:
      loadBalancer:
        servers: []

  middlewares:
    sslheader:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
    openclaw-operator-scopes:
      headers:
        customRequestHeaders:
          X-OpenClaw-Scopes: "operator.read,operator.write,operator.admin"
    collie-auth-recovery:
      redirectRegex:
        regex: "^https://collie\\.admin\\.faviann\\.com/auth/.*$"
        replacement: "https://collie.admin.faviann.com/outpost.goauthentik.io/start?rd=https%3A%2F%2Fcollie.admin.faviann.com%2F"
        permanent: false
    local-ip-restriction:
      IPAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "10.1.0.1/18"
          - "10.0.0.1/24"
          - "10.200.196.0/24"
