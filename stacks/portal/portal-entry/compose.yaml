---
# nginx reads its config only at startup.
x-restart-on-change:
  portal-entry:
    - ./appdata/nginx/conf.d/redirect.conf

services:
  portal-entry:
    image: nginx:alpine
    container_name: portal-entry
    restart: unless-stopped
    volumes:
      - ./appdata/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./appdata/nginx/legal:/usr/share/nginx/legal:ro
    networks:
      - shared
    labels:
      traefik.enable: true
      traefik.http.routers.portal-entry.rule: Host(`faviann.com`)
      traefik.http.routers.portal-entry.middlewares: protected-edge-auth@file
      # Public: the longer rule outranks portal-entry, so these skip edge auth.
      traefik.http.routers.portal-entry-legal.rule: Host(`faviann.com`) && (Path(`/about`) || Path(`/privacy`) || Path(`/terms`))
networks:
  shared:
    external: true
