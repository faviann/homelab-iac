map $http_x_authentik_groups $redirect_target {
    ~*admin           https://homepage.admin.faviann.com;
    ~*content-editor  https://homepage.home.faviann.com;
    default           https://homepage.media.faviann.com;
}

server {
    listen 80;
    server_name _;

    # Public pages the social login provider consoles link to. Google's brand
    # verification needs /about to describe the service and link the policy.
    location ~ ^/(about|privacy|terms)$ {
        root /usr/share/nginx/legal;
        charset utf-8;
        try_files $uri.html $uri.txt =404;
    }

    location / {
        return 302 $redirect_target;
    }
}
