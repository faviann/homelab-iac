---
x-prereq-dirs:
  - ./appdata/data
  - ./appdata/postgres
  - ./appdata/redis

services:
  sub2api:
    image: weishaw/sub2api:0.2.13@sha256:73797a8b44894c7b65c0bfcefe6002c7f3cfba6223f01e9d909c1d31365fcdf8
    container_name: sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Initializes the database and admin account on first start, no wizard.
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      # Upstream's self-use mode: hides the SaaS features and skips
      # billing/balance checks.
      RUN_MODE: simple
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?Set SUB2API_POSTGRES_PASSWORD in .env}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # ADMIN_PASSWORD unset on purpose: first start generates one and prints
      # it in the logs. It only applies while no admin exists; change it in the UI.
      # Both are regenerated on every start when empty, which logs everyone
      # out and invalidates every enrolled TOTP secret.
      JWT_SECRET: ${SUB2API_JWT_SECRET:?Set SUB2API_JWT_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_ENCRYPTION_KEY:?Set SUB2API_TOTP_ENCRYPTION_KEY in .env}
      # Authentik login, declared as sub2api-local in
      # stacks/auth/auth/appdata/authentik/oidc-apps.yaml. Endpoints come from
      # the issuer's discovery document. OIDC settings saved in the admin UI
      # override these.
      OIDC_CONNECT_ENABLED: "true"
      OIDC_CONNECT_PROVIDER_NAME: Authentik
      OIDC_CONNECT_CLIENT_ID: sub2api-local
      OIDC_CONNECT_CLIENT_SECRET: ${SUB2API_OIDC_CLIENT_SECRET:?Set SUB2API_OIDC_CLIENT_SECRET in .env}
      OIDC_CONNECT_ISSUER_URL: https://auth.faviann.com/application/o/sub2api-local/
      OIDC_CONNECT_REDIRECT_URL: https://gateway.ai.faviann.com/api/v1/auth/oauth/oidc/callback
      TZ: America/Toronto
    volumes:
      # The entrypoint chowns this to the image's uid 1000 before dropping root.
      - ./appdata/data:/app/data
    ports:
      - "8318:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18
    container_name: sub2api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?Set SUB2API_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sub2api
    volumes:
      # Mount the parent, not a pgdata subdirectory: PostgreSQL 18 creates and
      # owns its nested PGDATA with the ownership and mode it requires.
      - ./appdata/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    # No password: the port is never published, so only this stack's network
    # reaches it.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./appdata/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
