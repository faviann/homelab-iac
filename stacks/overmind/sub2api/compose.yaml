---
x-managed-files:
  - path: ./.env
    mode: "0600"

x-prereq-dirs:
  - ./appdata/data
  - ./appdata/postgres
  - ./appdata/redis

services:
  sub2api:
    image: weishaw/sub2api:0.2.15@sha256:da0fd94daebf890419e21e956821fd6c2008fc666f9617f2eb917f4492245da3
    container_name: sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      AUTO_SETUP: "true"
      RUN_MODE: simple
      DATABASE_HOST: postgres
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?Set SUB2API_POSTGRES_PASSWORD in .env}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      # Both are regenerated on every start when empty, which logs everyone
      # out and invalidates every enrolled TOTP secret.
      JWT_SECRET: ${SUB2API_JWT_SECRET:?Set SUB2API_JWT_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_ENCRYPTION_KEY:?Set SUB2API_TOTP_ENCRYPTION_KEY in .env}
      OIDC_CONNECT_ENABLED: "true"
      OIDC_CONNECT_PROVIDER_NAME: Authentik
      OIDC_CONNECT_CLIENT_ID: sub2api-local
      OIDC_CONNECT_CLIENT_SECRET: ${SUB2API_OIDC_CLIENT_SECRET:?Set SUB2API_OIDC_CLIENT_SECRET in .env}
      OIDC_CONNECT_ISSUER_URL: https://auth.faviann.com/application/o/sub2api-local/
      OIDC_CONNECT_REDIRECT_URL: https://gateway.ai.faviann.com/api/v1/auth/oauth/oidc/callback
      TZ: America/Toronto
    volumes:
      - ./appdata/data:/app/data
    ports:
      - "8318:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: sub2api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?Set SUB2API_POSTGRES_PASSWORD in .env}
    volumes:
      # Mount the parent, not a pgdata subdirectory: PostgreSQL 18 creates and
      # owns its nested PGDATA with the ownership and mode it requires.
      - ./appdata/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s

  redis:
    image: docker.io/library/redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: sub2api-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./appdata/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
