---
x-managed-files:
  - path: ./.env
    mode: "0600"

services:
  cliproxy-home:
    image: eceasy/cli-proxy-api-home:v1.1.0@sha256:14e666f537b26a3fe1cb1a17b458000ff80898edbd7d6cafd83a4d5f7450a49c
    container_name: cliproxy-home
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["sh", "-c", "umask 077; exec ./CLIProxyAPIHome"]
    volumes:
      - ./appdata/config/cluster.yaml:/CLIProxyAPIHome/cluster.yaml:ro
      # State and trust are root:root 0700 host directories, outside stack sync.
      - /data/overmind/cliproxy/home:/CLIProxyAPIHome/data
    ports:
      - "8327:8327"

  cliproxy:
    image: eceasy/cli-proxy-api:v7.3.8@sha256:6c2c8a7904799bd29a3f7f92a598555d8321b6a5682000b87af4495c5704fa72
    container_name: cliproxy
    restart: unless-stopped
    depends_on:
      - cliproxy-home
    command: ["sh", "-c", "umask 077; exec ./CLIProxyAPI"]
    environment:
      # An empty carrier would select standalone mode. Both rendering and
      # Compose must reject it before startup.
      HOME_JWT: ${HOME_JWT:?Set HOME_JWT from native Home enrollment in .env}
    volumes:
      - /data/overmind/cliproxy/cpa:/root/.cli-proxy-api
    ports:
      # Portal Traefik reaches this client port across the LAN.
      - "8317:8317"
