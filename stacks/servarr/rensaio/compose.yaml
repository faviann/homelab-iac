---
x-prereq-dirs:
  - ./appdata/config
  - /data/media/manga

services:
  rensaio:
    # Fork build carrying the CEF close fix and upstream PR 97 (bounded latest paging);
    # return to maxpiva/rensaio once upstream merges both
    image: ghcr.io/faviann/rensaio:homelab@sha256:2d3a4bc0a2dbbccf4f3c5517172dba183296364f1ffe56620257e5232cc5fb69
    container_name: rensaio
    restart: unless-stopped
    # The image ships server GC, which grows one heap per core until memory is tight;
    # workstation GC with ConserveMemory collects early and returns memory
    deploy:
      resources:
        limits:
          memory: 3G
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
      DOTNET_gcServer: 0
      DOTNET_GCConserveMemory: 8
    volumes:
      - ./appdata/config:/config
      - /data/media/manga:/series
    ports:
      - 9833:9833
    labels:
      traefik.enable: true
      traefik.http.routers.rensaio.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Arr
      homepage.instance.admin.name: Rensaio
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Manga and series download manager
      homepage.instance.admin.icon: mdi-book-open-page-variant
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
