---
x-prereq-dirs:
  - ./appdata/config
  - /data/media/manga

services:
  rensaio:
    # Fork build that lets CEF browsers close; return to maxpiva/rensaio once upstream merges the fix
    image: ghcr.io/faviann/rensaio:cef-close-fix@sha256:ebb9a824c37622765da884153fd948ef6399fb64015ba4f8605a00904d159784
    container_name: rensaio
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ./appdata/config:/config
      - /data/media/manga:/series
    ports:
      - 9833:9833
    labels:
      traefik.enable: true
      traefik.http.routers.rensaio.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Arr
      homepage.instance.admin.name: Rensaio
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Manga and series download manager
      homepage.instance.admin.icon: mdi-book-open-page-variant
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
