---
x-prereq-dirs:
  - ./appdata/sonarr

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/sonarr:/config
      - /data:/data
    ports:
      - 8989:8989
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Arr
      homepage.instance.admin.name: Sonarr
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: TV series management
      homepage.instance.admin.icon: sonarr
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
