---
x-prereq-dirs:
  - ./appdata/jackett

services:
  jackett:
    image: linuxserver/jackett:0.24.2865@sha256:4fcf3cc22dd3ee9718ac70db6edc8f805e5a74b315caccf1f699e3bd2d9fd0b2
    container_name: jackett
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/jackett:/config
    ports:
      - 9117:9117
    labels:
      traefik.enable: true
      traefik.http.routers.jackett.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Arr
      homepage.instance.admin.name: Jackett
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Torrent indexer proxy
      homepage.instance.admin.icon: jackett
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
