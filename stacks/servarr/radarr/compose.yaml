---
x-prereq-dirs:
  - ./appdata/radarr

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/radarr:/config
      - /data:/data
    ports:
      - 7878:7878
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Arr
      homepage.instance.admin.name: Radarr
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Movie management
      homepage.instance.admin.icon: radarr
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
