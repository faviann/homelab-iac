---
x-prereq-dirs:
  - ./appdata/bazarr

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2@sha256:b3db4247d3afa0c68bc5aa311bedd67b1caf4b3eabc3a85577682970435d5013
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/bazarr:/config
      - /data:/data
    ports:
      - 6767:6767
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Arr
      homepage.instance.admin.name: Bazarr
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Subtitle management
      homepage.instance.admin.icon: bazarr
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
