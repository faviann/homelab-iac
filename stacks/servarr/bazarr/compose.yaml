---
x-prereq-dirs:
  - ./appdata/bazarr

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2@sha256:9a625883f054e722795affe5e3ca71057e6ed817ecdf99f4a99624346fcc509c
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/bazarr:/config
      - /data:/data
    ports:
      - 6767:6767
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.middlewares: protected-edge-auth@file
      homepage.instance.admin.group: Arr
      homepage.instance.admin.name: Bazarr
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Subtitle management
      homepage.instance.admin.icon: bazarr
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
