---
x-prereq-dirs:
  - ./appdata/sabnzbd
  - /ephemeral/sabnzbd

services:
  sabnzbd:
    container_name: sabnzbd
    labels:
      traefik.enable: true
      homepage.instance.admin.group: Downloads
      homepage.instance.admin.name: SABnzbd
      homepage.instance.admin.href: https://${HOMEPAGE_FQDN}
      homepage.instance.admin.description: Usenet client
      homepage.instance.admin.icon: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/Montreal
    image: lscr.io/linuxserver/sabnzbd:5.1.3@sha256:b356d0a9b22db584e9005364ec4e752dfc081ce501b7145e9a5c0bb38e4d1ba4
    restart: unless-stopped
    ports:
      - $SABNZBD_PORT:8080 # sabnzbd
    volumes:
      - ./appdata/sabnzbd:/config
      - /data:/data # optional
      - /ephemeral/sabnzbd:/ephemeral # optional
networks: {}
