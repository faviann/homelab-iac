---
# The vault is deliberately outside group_vars: only credential consumers load it.
- name: Establish Proxmox API credential material
  block:
    - name: Load encrypted credentials for this API consumer
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/vault.yml"
      when: lookup('ansible.builtin.fileglob', inventory_dir ~ '/vault.yml') | length > 0
      no_log: true

    - name: Validate consumed Proxmox API fields
      ansible.builtin.assert:
        that:
          - item is string
          - item | trim | length > 0
          - "'REPLACE' not in item"
        quiet: true
      loop:
        - "{{ proxmox_api_user | default('') }}"
        - "{{ proxmox_api_token_id | default('') }}"
        - "{{ proxmox_api_token_secret | default('') }}"
      no_log: true
  rescue:
    - name: Report the consumed API credential prerequisite
      ansible.builtin.fail:
        msg: >-
          Proxmox API credentials require a non-empty user, token ID and token secret.
          Configure inventory/vault.yml and its vault passphrase file for this API operation.
