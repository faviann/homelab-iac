---
# Busy-check gate. Publishes lxc_busy_check_result:
#   {deferred_stacks: [{stack, state, reason}], host_deferred: bool}
# Declarations are read on the controller, so a host without them runs no
# remote command. Only idle and not_deployed let a stack proceed.

- name: Start with no busy-check declarations
  ansible.builtin.set_fact:
    lxc_busy_check_declarations: []

- name: Read busy-check declarations from the repo stack source
  ansible.builtin.set_fact:
    lxc_busy_check_declarations: "{{ lxc_busy_check_stacks_source | busy_check_declarations }}"
  when:
    - not (lxc_busy_check_override | bool)
    - not (ansible_check_mode | bool)
    - docker_enabled | default(false) | bool
    - lxc_busy_check_guest_running | bool

- name: Run each declared busy check inside its service
  ansible.builtin.command:
    argv: >-
      {{
        ['sh', '-c', lookup('ansible.builtin.file', 'busy_check_probe.sh'), 'busy-check',
         item.stack, item.service, item.timeout | string]
        + item.command
      }}
  loop: "{{ lxc_busy_check_declarations | selectattr('error', 'undefined') | list }}"
  loop_control:
    label: "{{ item.stack }}"
  register: lxc_busy_check_probes
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: Publish the busy-check result
  ansible.builtin.set_fact:
    lxc_busy_check_result:
      deferred_stacks: "{{ deferred }}"
      host_deferred: "{{ deferred | length > 0 }}"
  vars:
    outcomes: >-
      {%- set outcomes = [] -%}
      {%- for entry in lxc_busy_check_declarations | selectattr('error', 'defined') -%}
      {%-   set _ = outcomes.append({'stack': entry.stack, 'state': 'check_failed', 'reason': entry.error}) -%}
      {%- endfor -%}
      {%- for probe in lxc_busy_check_probes.results | default([]) -%}
      {%-   set lines = probe.stdout_lines | default([]) -%}
      {%-   if probe.unreachable | default(false) -%}
      {%-     set state, reason = 'check_failed', 'guest unreachable' -%}
      {%-   elif probe.rc | default(-1) != 0 or (lines | first | default('')) not in ['idle', 'busy', 'check_failed', 'not_deployed'] -%}
      {%-     set detail = probe.stderr | default(probe.msg | default('')) | trim -%}
      {%-     set state, reason = 'check_failed', 'probe failed' ~ (': ' ~ detail if detail else '') -%}
      {%-   else -%}
      {%-     set state, reason = lines[0], lines[1:] | join(' ') -%}
      {%-   endif -%}
      {%-   set _ = outcomes.append({'stack': probe.item.stack, 'state': state, 'reason': reason | trim | truncate(200)}) -%}
      {%- endfor -%}
      {{ outcomes }}
    deferred: "{{ outcomes | selectattr('state', 'in', ['busy', 'check_failed']) | list }}"

- name: Report busy-check deferrals for this host
  ansible.builtin.debug:
    msg: >-
      Deferring {{ lxc_busy_check_result.deferred_stacks | map(attribute='stack') | join(', ') }};
      skipping host-side reconciliation, package upgrade, and reboot.
  when: lxc_busy_check_result.host_deferred | bool
