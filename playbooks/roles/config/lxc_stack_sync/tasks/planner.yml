---
# Compose manifest planner: derive execution inputs from discovered source stacks.

- name: Initialize compose manifest plan
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan:
      templated_outputs: []
      stack_dirs_to_create: []
      files_to_render: []
      files_to_copy: []
      prereq_dirs: []
      ownership_overrides: "{{ lxc_docker_environment_internal.path_ownership_overrides | default([]) }}"
      managed_files: []
      managed_file_parent_dirs: []

- name: Build planned render items for per-host templates
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'templated_outputs': files_to_render | map(attribute='relative_path') | list,
              'files_to_render': files_to_render
            },
            recursive=True
          )
      }}
  vars:
    files_to_render: >-
      {%- set planned_files = [] -%}
      {%- for file in _per_host_j2_files.files | default([]) -%}
      {%- set relative_path = file.path | relpath(lxc_docker_environment_internal.stacks_source) | regex_replace('\.j2$', '') -%}
      {%- set _ = planned_files.append({
        'source_path': file.path,
        'dest_path': lxc_docker_environment_internal.shared_mount_source ~ '/stacks/' ~ relative_path,
        'relative_path': relative_path,
        'stack_name': relative_path.split('/')[0]
      }) -%}
      {%- endfor -%}
      {{ planned_files }}

# The only render of stack templates. Content stays in this registered result
# and is never copied into a fact, so no_log keeps it out of every output.
- name: Render planned stack templates
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', item.source_path) }}"
  vars:
    stack_name: "{{ item.stack_name }}"
    stack_vars: "{{ (lxc_docker_env_stack_vars | default({}))[item.stack_name] | default({}) }}"
  loop: "{{ lxc_stack_sync_manifest_plan.files_to_render }}"
  loop_control:
    label: "{{ item.relative_path }}"
  register: _lxc_stack_sync_rendered_templates
  ignore_errors: true

- name: Fail when planned stack templates cannot render
  ansible.builtin.fail:
    msg: >-
      Stack templates failed to render on {{ inventory_hostname }}: {{ failed | join(', ') }}.
      Render errors are hidden because they can contain stack values.
  vars:
    failed: >-
      {{
        _lxc_stack_sync_rendered_templates.results | default([])
        | selectattr('failed', 'defined') | selectattr('failed')
        | map(attribute='item.relative_path') | sort
      }}
  when: failed | length > 0
  no_log: false

- name: Collect compose sources for planner discovery
  ansible.builtin.debug:
    msg: >-
      {%- set sources = [] -%}
      {%- set compose_names = ['compose.yml', 'compose.yaml', 'compose.override.yml', 'compose.override.yaml'] -%}
      {%- for rendered in _lxc_stack_sync_rendered_templates.results | default([]) -%}
      {%- if (rendered.item.relative_path | basename) in compose_names -%}
      {%- set _ = sources.append({'target_dir': rendered.item.dest_path | dirname, 'content': rendered.msg}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for file in _per_host_static_files.files | default([]) -%}
      {%- set relative_path = file.path | relpath(lxc_docker_environment_internal.stacks_source) -%}
      {%- if (relative_path | basename) in compose_names
        and relative_path not in lxc_stack_sync_manifest_plan.templated_outputs -%}
      {%- set _ = sources.append({
        'target_dir': (lxc_docker_environment_internal.shared_mount_source ~ '/stacks/' ~ relative_path) | dirname,
        'content': lookup('ansible.builtin.file', file.path)
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ sources }}
  register: _lxc_stack_sync_compose_sources

- name: Build planner target stack directory list
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'stack_dirs_to_create': (
                target_dirs
              )
            },
            recursive=True
          )
      }}
  vars:
    target_dirs: >-
      {%- set planned_dirs = [] -%}
      {%- for stack_name in lxc_docker_env_desired_top_level_stack_dirs | default([]) -%}
      {%- set _ = planned_dirs.append(
        lxc_docker_environment_internal.shared_mount_source
        ~ '/stacks/'
        ~ stack_name
      ) -%}
      {%- endfor -%}
      {%- for directory in _per_host_dirs.files | default([]) -%}
      {%- set _ = planned_dirs.append(
        lxc_docker_environment_internal.shared_mount_source
        ~ '/stacks/'
        ~ (directory.path | relpath(lxc_docker_environment_internal.stacks_source))
      ) -%}
      {%- endfor -%}
      {{ planned_dirs | unique }}

- name: Build planner file copy list
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'files_to_copy': files_to_copy
            },
            recursive=True
          )
      }}
  vars:
    files_to_copy: >-
      {%- set planned_files = [] -%}
      {%- for file in _per_host_static_files.files | default([]) -%}
      {%- set relative_path = file.path | relpath(lxc_docker_environment_internal.stacks_source) -%}
      {%- if relative_path not in (lxc_stack_sync_manifest_plan.templated_outputs | default([])) -%}
      {%- set _ = planned_files.append({
        'source_path': file.path,
        'dest_path': lxc_docker_environment_internal.shared_mount_source ~ '/stacks/' ~ relative_path,
        'relative_path': relative_path,
        'stack_name': relative_path.split('/')[0]
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ planned_files }}

- name: Build planner prereq directories
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'prereq_dirs': planned_prereq_dirs
            },
            recursive=True
          )
      }}
  vars:
    planned_prereq_dirs: >-
      {%- set dirs = [] -%}
      {%- set override_paths = lxc_docker_environment_internal.path_ownership_overrides | default([]) | map(attribute='path') | list -%}
      {%- for compose_spec in _lxc_stack_sync_compose_sources.msg -%}
      {%- set compose = compose_spec.content | from_yaml -%}
      {%- if compose is mapping -%}
      {%- set prereq_dirs = compose.get('x-prereq-dirs', []) -%}
      {%- if prereq_dirs is sequence and prereq_dirs is not string and prereq_dirs is not mapping -%}
      {%- for prereq_dir in prereq_dirs -%}
      {%- if prereq_dir is string -%}
      {%- if prereq_dir.startswith('./') -%}
      {%- set resolved_prereq_dir = compose_spec.target_dir + '/' + prereq_dir[2:] -%}
      {%- else -%}
      {%- set resolved_prereq_dir = prereq_dir -%}
      {%- endif -%}
      {%- if resolved_prereq_dir not in override_paths -%}
      {%- set _ = dirs.append({
        'path': resolved_prereq_dir,
        'owner': lxc_docker_environment_internal.docker_uid,
        'group': lxc_docker_environment_internal.docker_gid,
        'mode': '0755'
      }) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ dirs | unique(attribute='path') }}
  when: _lxc_stack_sync_compose_sources.msg | length > 0

- name: Build planner managed file list
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'managed_files': planned_managed_files
            },
            recursive=True
          )
      }}
  vars:
    planned_managed_files: >-
      {%- set files = [] -%}
      {%- for compose_spec in _lxc_stack_sync_compose_sources.msg -%}
      {%- set compose = compose_spec.content | from_yaml -%}
      {%- if compose is mapping -%}
      {%- set managed_files = compose.get('x-managed-files', []) -%}
      {%- if managed_files is sequence and managed_files is not string and managed_files is not mapping -%}
      {%- for entry in managed_files -%}
      {%- if entry is mapping and entry.path is defined -%}
      {%- if entry.path.startswith('./') -%}
      {%- set resolved = compose_spec.target_dir + '/' + entry.path[2:] -%}
      {%- else -%}
      {%- set resolved = entry.path -%}
      {%- endif -%}
      {%- set _ = files.append({
        'path': resolved,
        'owner': entry.owner | default(lxc_docker_environment_internal.shared_owner),
        'group': entry.group | default(lxc_docker_environment_internal.shared_group),
        'mode': entry.mode | default('0644')
      }) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ files | unique(attribute='path') }}
  when: _lxc_stack_sync_compose_sources.msg | length > 0

- name: Apply managed metadata to planned synced files
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'files_to_render': (
                planned_synced_files
                | selectattr('source_path', 'in', render_source_paths)
                | list
              ),
              'files_to_copy': (
                planned_synced_files
                | rejectattr('source_path', 'in', render_source_paths)
                | list
              )
            },
            recursive=True
          )
      }}
  vars:
    render_source_paths: >-
      {{
        lxc_stack_sync_manifest_plan.files_to_render
        | map(attribute='source_path')
        | list
      }}
    planned_synced_files: >-
      {%- set planned_files = [] -%}
      {%- for file in (
        lxc_stack_sync_manifest_plan.files_to_render
        + lxc_stack_sync_manifest_plan.files_to_copy
      ) -%}
      {%- set managed = (
        lxc_stack_sync_manifest_plan.managed_files
        | default([])
        | selectattr('path', 'equalto', file.dest_path)
        | first
        | default({})
      ) -%}
      {%- set _ = planned_files.append(file | combine({
        'owner': managed.owner | default(lxc_docker_environment_internal.shared_owner),
        'group': managed.group | default(lxc_docker_environment_internal.shared_group),
        'mode': managed.mode | default('0644')
      })) -%}
      {%- endfor -%}
      {{ planned_files }}

- name: Build planner managed file parent directories
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'managed_file_parent_dirs': planned_parent_dirs
            },
            recursive=True
          )
      }}
  vars:
    planned_parent_dirs: >-
      {%- set dirs = [] -%}
      {%- for file in lxc_stack_sync_manifest_plan.managed_files | default([]) -%}
      {%- set _ = dirs.append({
        'path': file.path | dirname,
        'owner': file.owner,
        'group': file.group,
        'mode': '0755'
      }) -%}
      {%- endfor -%}
      {{ dirs | unique(attribute='path') }}
  when: (lxc_stack_sync_manifest_plan.managed_files | default([])) | length > 0
