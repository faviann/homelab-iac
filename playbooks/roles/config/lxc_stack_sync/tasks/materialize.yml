---
# Materialize: execute the compose manifest plan by syncing stack files and creating planned assets.

- name: Validate selected stack template inputs before materialization
  block:
    - name: Render selected stack templates without writing assets
      ansible.builtin.assert:
        that: lookup('ansible.builtin.template', item.path) is string
        quiet: true
      vars:
        stack_name: "{{ (item.path | relpath(lxc_docker_environment_internal.stacks_source)).split('/')[0] }}"
        stack_vars: "{{ (lxc_docker_env_stack_vars | default({}))[stack_name] | default({}) }}"
      loop: "{{ _per_host_j2_files.files | default([]) }}"
      no_log: true
  rescue:
    - name: Report missing or invalid selected stack template inputs
      ansible.builtin.fail:
        msg: >-
          Required stack template inputs are missing or invalid for {{ inventory_hostname }}.
          Check stack_vars for the selected templates:
          {{ _per_host_j2_files.files | map(attribute='path') | join(', ') }}.

- name: Plan desired stack materialization inputs
  ansible.builtin.include_tasks:
    file: planner.yml
    apply:
      no_log: true

- name: Check which stack prereq dirs already exist
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ lxc_stack_sync_manifest_plan.prereq_dirs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: _stack_sync_prereq_dir_stats
  when: (lxc_stack_sync_manifest_plan.prereq_dirs | default([])) | length > 0

- name: Verify existing stack prereq paths are directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false))
    fail_msg: >-
      Stack prerequisite path is not a directory: {{ item.item.path }}
  loop: "{{ ((_stack_sync_prereq_dir_stats | default({})).results | default([])) }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Create per-host stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lxc_docker_environment_internal.shared_owner }}"
    group: "{{ lxc_docker_environment_internal.shared_group }}"
    mode: "0755"
  loop: "{{ lxc_stack_sync_manifest_plan.stack_dirs_to_create | default([]) }}"
  loop_control:
    label: "{{ item | relpath(lxc_docker_environment_internal.shared_mount_source ~ '/stacks') }}"
  register: _stack_sync_stack_dir_results
  when: (lxc_stack_sync_manifest_plan.stack_dirs_to_create | default([])) | length > 0

- name: Render templated files (.j2) for per-host stacks
  ansible.builtin.template:
    src: "{{ item.source_path }}"
    dest: "{{ item.dest_path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  vars:
    stack_name: "{{ item.stack_name }}"
    stack_vars: "{{ (lxc_docker_env_stack_vars | default({}))[item.stack_name] | default({}) }}"
  loop: "{{ lxc_stack_sync_manifest_plan.files_to_render | default([]) }}"
  loop_control:
    label: "{{ item.relative_path }}"
  register: _stack_sync_template_results
  no_log: true
  diff: false

- name: Copy static files for per-host stacks
  ansible.builtin.copy:
    src: "{{ item.source_path }}"
    dest: "{{ item.dest_path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ lxc_stack_sync_manifest_plan.files_to_copy | default([]) }}"
  loop_control:
    label: "{{ item.relative_path }}"
  register: _stack_sync_copy_results

- name: Limit stack prereq directory plan to missing paths
  ansible.builtin.set_fact:
    lxc_stack_sync_manifest_plan: >-
      {{
        lxc_stack_sync_manifest_plan
        | combine(
            {
              'prereq_dirs': (
                ((_stack_sync_prereq_dir_stats | default({})).results | default([]))
                | rejectattr('stat.exists')
                | map(attribute='item')
                | list
              )
            },
            recursive=True
          )
      }}
  when: (lxc_stack_sync_manifest_plan.prereq_dirs | default([])) | length > 0
  no_log: true

- name: Ensure stack prereq dirs exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ lxc_stack_sync_manifest_plan.prereq_dirs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: _stack_sync_prereq_dir_results
  when: (lxc_stack_sync_manifest_plan.prereq_dirs | default([])) | length > 0

- name: Apply path-specific ownership overrides for stack data
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    recurse: "{{ item.recurse | default(false) }}"
  loop: "{{ lxc_stack_sync_manifest_plan.ownership_overrides | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: _stack_sync_ownership_override_results
  when: (lxc_stack_sync_manifest_plan.ownership_overrides | default([])) | length > 0

- name: Ensure managed file parent directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ lxc_stack_sync_manifest_plan.managed_file_parent_dirs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: _stack_sync_managed_file_parent_dir_results
  when: (lxc_stack_sync_manifest_plan.managed_file_parent_dirs | default([])) | length > 0

- name: Create managed files when absent
  ansible.builtin.copy:
    content: ""
    dest: "{{ item.path }}"
    force: false
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: >-
    {{
      lxc_stack_sync_manifest_plan.managed_files
      | default([])
      | rejectattr('path', 'in', synced_file_paths)
      | list
    }}
  loop_control:
    label: "{{ item.path }}"
  register: _stack_sync_managed_file_create_results
  when: (lxc_stack_sync_manifest_plan.managed_files | default([])) | length > 0
  vars:
    synced_file_paths: >-
      {{
        (
          lxc_stack_sync_manifest_plan.files_to_render
          + lxc_stack_sync_manifest_plan.files_to_copy
        )
        | map(attribute='dest_path')
        | list
      }}

- name: Ensure managed file permissions are correct
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: >-
    {{
      lxc_stack_sync_manifest_plan.managed_files
      | default([])
      | rejectattr('path', 'in', synced_file_paths)
      | list
    }}
  loop_control:
    label: "{{ item.path }}"
  register: _stack_sync_managed_file_permission_results
  when: (lxc_stack_sync_manifest_plan.managed_files | default([])) | length > 0
  vars:
    synced_file_paths: >-
      {{
        (
          lxc_stack_sync_manifest_plan.files_to_render
          + lxc_stack_sync_manifest_plan.files_to_copy
        )
        | map(attribute='dest_path')
        | list
      }}

- name: Publish materialization slice into stack reconciliation
  ansible.builtin.set_fact:
    _lxc_docker_env_reconciliation: >-
      {{
        (_lxc_docker_env_reconciliation | default({}))
        | combine(
            {
              'materialized': {
                'changed_results': (
                  ((_stack_sync_stack_dir_results | default({})).results | default([]))
                  + ((_stack_sync_template_results | default({})).results | default([]))
                  + ((_stack_sync_copy_results | default({})).results | default([]))
                  + ((_stack_sync_prereq_dir_results | default({})).results | default([]))
                  + ((_stack_sync_ownership_override_results | default({})).results | default([]))
                  + ((_stack_sync_managed_file_parent_dir_results | default({})).results | default([]))
                  + ((_stack_sync_managed_file_create_results | default({})).results | default([]))
                  + ((_stack_sync_managed_file_permission_results | default({})).results | default([]))
                )
              }
            },
            recursive=True
          )
      }}
