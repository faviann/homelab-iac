---
# Default variables for lxc_docker_runtime role

# ==============================================================================
# Docker Installation Configuration
# ==============================================================================
# Docker installation (uses geerlingguy.docker role)
lxc_docker_runtime_install_compose_plugin: true
lxc_docker_runtime_compose_package: docker-compose-plugin
lxc_docker_runtime_compose_package_state: present

# Docker daemon options. geerlingguy.docker writes this mapping to
# /etc/docker/daemon.json verbatim, so Ansible must declare the complete file
# in one pass — including the NVIDIA runtime on GPU hosts. Anything left to a
# second writer (nvidia-ctk) makes both writers rewrite the file and restart
# Docker on every apply.
#
# Ordering note: configure.yml runs this role before lxc_nvidia_runtime, so on a
# freshly built GPU host daemon.json declares path: nvidia-container-runtime and
# Docker restarts before that binary exists. Docker 29.7.2 accepted this file
# in `dockerd --validate` without nvidia-container-runtime present. A future
# daemon could require the binary at startup, so a Docker start/restart failure
# on a fresh GPU LXC after a version change is a reason to check this ordering.
# Keep NVIDIA workloads off the host until lxc_nvidia_runtime has run.
#
# The runtimes block is a byte-for-byte restatement of what
# `nvidia-ctk runtime configure --runtime=docker` emitted with NVIDIA Container
# Toolkit 1.19.1. A newer toolkit may expect a different shape. When Docker or
# the toolkit changes version, verify a fresh GPU-LXC provision and a GPU
# workload, and compare this block with the toolkit's generated configuration.
# Runtime registration alone does not prove a GPU workload can run. If Docker
# starts but GPU containers fail, this declaration is another assumption to
# check. Preserve the single writer and log rotation if ordering or shape must
# change. Historical findings and constraints:
# https://github.com/faviann/homelab-iac/issues/143
lxc_docker_runtime_daemon_options: >-
  {{
    {
      'log-driver': 'json-file',
      'log-opts': {'max-size': '10m', 'max-file': '3'},
    }
    | combine(
      {'runtimes': {'nvidia': {'args': [], 'path': 'nvidia-container-runtime'}}}
      if (gpu_enabled | default(false) | bool) else {}
    )
  }}
