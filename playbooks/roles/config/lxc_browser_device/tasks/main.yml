---
# The operator logs in as lxc_ssh_user at uid 1000; the browser session runs as
# a separate account.
- name: Create the operator and session accounts
  vars:
    lxc_browser_device_accounts:
      - name: "{{ lxc_ssh_user }}"
        uid: "{{ lxc_ssh_uid }}"
        gid: "{{ lxc_ssh_gid }}"
      - name: "{{ browser_device_session_user }}"
        uid: "{{ browser_device_session_uid }}"
        gid: "{{ browser_device_session_uid }}"
  block:
    - name: Ensure account groups exist
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        state: present
      loop: "{{ lxc_browser_device_accounts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure accounts exist
      ansible.builtin.user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        group: "{{ item.name }}"
        shell: /bin/bash
        state: present
      loop: "{{ lxc_browser_device_accounts }}"
      loop_control:
        label: "{{ item.name }}"

- name: Configure origin firewall
  ansible.builtin.include_role:
    name: config/lxc_origin_firewall

# Nothing that locks or blanks the session is installed: no display manager,
# screensaver, or keyring.
- name: Install the display server, window manager, xset, and session view
  ansible.builtin.apt:
    name:
      - tigervnc-standalone-server
      - openbox
      - x11-xserver-utils
      - novnc
      - websockify
    install_recommends: false
    state: present

- name: Check for Google Chrome
  ansible.builtin.stat:
    path: /usr/bin/google-chrome-stable
  register: _browser_device_chrome

# The package installs Google's signing key and apt source and rewrites that
# source daily, so apt owns every later Chrome upgrade.
- name: Install Google Chrome
  ansible.builtin.apt:
    deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    install_recommends: false
  when: not _browser_device_chrome.stat.exists

- name: Ensure the Chrome managed policy directory exists
  ansible.builtin.file:
    path: /etc/opt/chrome/policies/managed
    state: directory
    mode: "0755"

- name: Force-install the browser extensions
  ansible.builtin.copy:
    dest: /etc/opt/chrome/policies/managed/browser-device.json
    content: "{{ {'ExtensionInstallForcelist': browser_device_extension_ids} | to_nice_json }}\n"
    mode: "0644"

- name: Install the session units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: /etc/systemd/system/{{ item }}.service
    mode: "0644"
  # The session view unit carries the websockify credential.
  diff: false
  loop:
    - crawler-display
    - crawler-wm
    - crawler-browser
    - crawler-session-view
  register: _browser_device_units

# Only a changed unit restarts, so a converged run leaves the session alone.
- name: Run the session units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    daemon_reload: "{{ _browser_device_units is changed }}"
    enabled: true
    state: "{{ item.changed | ternary('restarted', 'started') }}"
  loop: "{{ _browser_device_units.results }}"
  loop_control:
    label: "{{ item.item }}"
