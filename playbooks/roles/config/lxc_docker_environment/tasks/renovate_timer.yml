---
# Weekly Renovate run: the timer starts the stack's exited one-shot container.

- name: Install Renovate service
  ansible.builtin.template:
    src: renovate.service.j2
    dest: /etc/systemd/system/renovate.service
    owner: root
    group: root
    mode: "0644"
  register: _renovate_service

- name: Install Renovate timer
  ansible.builtin.template:
    src: renovate.timer.j2
    dest: /etc/systemd/system/renovate.timer
    owner: root
    group: root
    mode: "0644"
  register: _renovate_timer

- name: Reload systemd for Renovate unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _renovate_service.changed or _renovate_timer.changed

- name: Enable and start Renovate timer
  ansible.builtin.systemd_service:
    name: renovate.timer
    enabled: true
    state: started
