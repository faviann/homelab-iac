---
# Main tasks file for lxc_base_system role
# Handles base system configuration. upgrade.yml and reboot.yml run separately.

- name: Ensure essential packages are installed
  ansible.builtin.apt:
    name:
      - sudo
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
  when: lxc_base_system_install_essentials | default(true)

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ lxc_base_system_apt_cache_valid_time }}"
  when: lxc_base_system_apt_update_cache | bool

# Long-running daemons read the zone at startup; cron is the only one here.
- name: Set the system timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ lxc_timezone }}"
    dest: /etc/localtime
    state: link
  notify: restart cron
