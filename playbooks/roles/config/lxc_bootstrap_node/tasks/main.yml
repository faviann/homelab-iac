---
# The bootstrap node is the control node that runs the nightly deploy and
# carries interrupting workstation runs (docs/bootstrap-node.md). The role
# delivers the deploy webhook, and copies the control node's vault passphrase,
# fleet key, and fleet known_hosts (ADR-0020, ADR-0021).

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true

- name: Install uv
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -LsSf https://astral.sh/uv/{{ lxc_bootstrap_node_uv_version }}/install.sh
      | UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
    executable: /bin/bash
    creates: /usr/local/bin/uv

# The first clone only. After it, the deploy recipe alone moves the checkout.
# Skipped in check mode, where git may not be installed yet.
- name: Clone the repository
  ansible.builtin.git:
    repo: https://github.com/faviann/homelab-iac.git
    dest: /root/homelab-iac
    version: main
    update: false
  when: not ansible_check_mode

# The copy below does not create a missing parent for a single file, and a
# new node has no /root/.ansible/ssh.
- name: Create the fleet key directory
  ansible.builtin.file:
    path: /root/.ansible/ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

# From the control node running this play; no_log and diff: false keep the
# contents out of output and diffs. The known_hosts carries the Proxmox
# host-key anchor, so the node never trusts Proxmox on first use.
- name: Copy the vault passphrase, the fleet key, and the fleet known_hosts
  ansible.builtin.copy:
    src: "{{ [lookup('env', 'HOME'), '.ansible', item.path] | path_join }}"
    dest: "/root/.ansible/{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  diff: false
  no_log: true
  loop:
    - { path: vault-pass, mode: "0600" }
    - { path: ssh/proxmox_lxc, mode: "0600" }
    - { path: ssh/proxmox_lxc.pub, mode: "0644" }
    - { path: known_hosts, mode: "0600" }

# Every deploy posts its outcome here; a placeholder fails the run. no_log
# hides any message, so the name says what to set.
- name: Assert the deploy webhook (vault_dockhand_discord_webhook_url) is configured
  ansible.builtin.assert:
    that:
      - bootstrap_deploy_discord_webhook_url is defined
      - bootstrap_deploy_discord_webhook_url | credential_is_configured
  no_log: true

- name: Install the deploy webhook environment
  ansible.builtin.template:
    src: workstation-deploy.env.j2
    dest: /etc/workstation-deploy.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the deploy script and the notifier
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - homelab-deploy
    - workstation-deploy-notify

- name: Install the deploy units and the nightly timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - workstation-deploy@.service
    - workstation-deploy-interrupt@.service
    - nightly-deploy@.service
    - nightly-deploy.timer

# Starting it again also undoes a person's `systemctl stop`.
- name: Enable and start the nightly timer
  ansible.builtin.systemd_service:
    name: nightly-deploy.timer
    enabled: true
    state: started
    daemon_reload: true
