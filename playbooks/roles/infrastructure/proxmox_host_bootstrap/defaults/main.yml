---
# Default variables for proxmox_host_bootstrap role
# Prepares SSH access and validates Proxmox host readiness

# Proxmox host connection details
proxmox_host: "{{ proxmox_api_host | default('proxmox.lan') }}"
proxmox_ssh_user: root

# Nothing creates the identity; the live boundary verifies it before Ansible
# starts.
proxmox_ssh_key_private: "{{ [lookup('env', 'HOME'), '.ansible', 'ssh', 'proxmox_lxc'] | path_join }}"

# Connection timeouts
proxmox_ssh_connect_timeout: 5
proxmox_ssh_port: 22

# Validation checks
proxmox_validate_pct: true
proxmox_validate_api: true
proxmox_min_lxc_pve_version: "6.0.5-2"

# Password-authenticated enrollment prefix. sshpass -e reads SSHPASS from the
# environment, so the password reaches neither a shell nor the process table.
proxmox_ssh_password_argv:
  - sshpass
  - -e
  - ssh
  - -p
  - "{{ proxmox_ssh_port | string }}"
  - -o
  - StrictHostKeyChecking=accept-new
  - -o
  - "ConnectTimeout={{ proxmox_ssh_connect_timeout }}"
  - "{{ proxmox_ssh_user }}@{{ proxmox_host }}"

# Runs on the Proxmox host. @PUBKEY_B64@ is substituted with the base64 of the
# selected public key, whose alphabet the remote shell cannot reinterpret.
proxmox_host_enrollment_script: |
  set -eu
  changed=0
  pubkey="$(printf '%s' '@PUBKEY_B64@' | base64 -d)"
  [ -n "$pubkey" ]

  ssh_dir=/root/.ssh
  auth_keys="$ssh_dir/authorized_keys"

  umask 077

  if [ ! -d "$ssh_dir" ]; then
    mkdir -p "$ssh_dir"
    changed=1
  fi

  if [ "$(stat -c '%u:%g' "$ssh_dir")" != '0:0' ]; then
    chown 0:0 "$ssh_dir"
    changed=1
  fi

  if [ "$(stat -c '%a' "$ssh_dir")" != '700' ]; then
    chmod 700 "$ssh_dir"
    changed=1
  fi

  if [ ! -f "$auth_keys" ]; then
    : > "$auth_keys"
    changed=1
  fi

  if [ "$(stat -c '%u:%g' "$auth_keys")" != '0:0' ]; then
    chown 0:0 "$auth_keys"
    changed=1
  fi

  if [ "$(stat -c '%a' "$auth_keys")" != '600' ]; then
    chmod 600 "$auth_keys"
    changed=1
  fi

  if ! grep -qxF -- "$pubkey" "$auth_keys"; then
    printf '%s\n' "$pubkey" >> "$auth_keys"
    changed=1
  fi

  printf 'CHANGED=%s\n' "$changed"
