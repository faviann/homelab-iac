---
- name: Reject Proxmox host SSH enrollment in check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: Proxmox host SSH enrollment cannot run in check mode.
    quiet: true

# Enrollment is the only operation that needs the key material itself, to name
# the identity it authorizes and to append it on the target.
- name: Resolve selected controller SSH public key
  ansible.builtin.include_role:
    name: infrastructure/ssh_key_shared
    tasks_from: resolve_pubkey

- name: Resolve selected controller SSH identity fingerprint
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -lf
      - "{{ ssh_key_shared_resolved_public_key_path }}"
  register: pubkey_fingerprint
  changed_when: false
  delegate_to: localhost

- name: Identify the authorized Proxmox host enrollment
  ansible.builtin.debug:
    msg: >-
      Selected identity {{ pubkey_fingerprint.stdout }} for
      {{ proxmox_ssh_user }}@{{ proxmox_host }}:{{ proxmox_ssh_port }}.

- name: Prompt for Proxmox host password
  ansible.builtin.pause:
    prompt: "Password for {{ proxmox_ssh_user }}@{{ proxmox_host }}"
    echo: false
  register: proxmox_root_password
  delegate_to: localhost

- name: Verify Proxmox host password authentication
  ansible.builtin.command:
    cmd: >-
      sshpass -p "{{ proxmox_root_password.user_input }}"
      ssh -p {{ proxmox_ssh_port }}
          -o StrictHostKeyChecking=accept-new
          -o ConnectTimeout={{ proxmox_ssh_connect_timeout }}
      {{ proxmox_ssh_user }}@{{ proxmox_host }}
      'echo PASSWORD_OK'
  register: password_test
  changed_when: false
  failed_when: password_test.rc != 0
  no_log: true
  delegate_to: localhost

- name: Ensure Proxmox host SSH directory exists
  ansible.builtin.command:
    cmd: >-
      sshpass -p "{{ proxmox_root_password.user_input }}"
      ssh -p {{ proxmox_ssh_port }} -o StrictHostKeyChecking=accept-new
      {{ proxmox_ssh_user }}@{{ proxmox_host }}
      'mkdir -p /root/.ssh && chmod 700 /root/.ssh && chown root:root /root/.ssh'
  changed_when: true
  no_log: true
  delegate_to: localhost

- name: Check selected identity enrollment on Proxmox host
  ansible.builtin.command:
    cmd: >-
      sshpass -p "{{ proxmox_root_password.user_input }}"
      ssh -p {{ proxmox_ssh_port }} -o StrictHostKeyChecking=accept-new
      {{ proxmox_ssh_user }}@{{ proxmox_host }}
      "grep -qxF -- '{{ ssh_key_shared_public_key_content }}' /root/.ssh/authorized_keys 2>/dev/null"
  register: key_exists_check
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: localhost

- name: Enroll selected identity on Proxmox host
  ansible.builtin.shell:
    cmd: |
      sshpass -p "{{ proxmox_root_password.user_input }}" \
      ssh -p {{ proxmox_ssh_port }} -o StrictHostKeyChecking=accept-new \
      {{ proxmox_ssh_user }}@{{ proxmox_host }} \
      "echo '{{ ssh_key_shared_public_key_content }}' >> /root/.ssh/authorized_keys"
  changed_when: true
  no_log: true
  delegate_to: localhost
  when: key_exists_check.rc != 0

- name: Set Proxmox host authorized_keys permissions
  ansible.builtin.command:
    cmd: >-
      sshpass -p "{{ proxmox_root_password.user_input }}"
      ssh -p {{ proxmox_ssh_port }} -o StrictHostKeyChecking=accept-new
      {{ proxmox_ssh_user }}@{{ proxmox_host }}
      'chmod 600 /root/.ssh/authorized_keys && chown root:root /root/.ssh/authorized_keys'
  changed_when: false
  no_log: true
  delegate_to: localhost

- name: Verify selected identity is enrolled on Proxmox host
  ansible.builtin.command:
    cmd: >-
      ssh -i {{ proxmox_ssh_key_private }}
          -p {{ proxmox_ssh_port }}
          -o BatchMode=yes
          -o ConnectTimeout={{ proxmox_ssh_connect_timeout }}
          -o StrictHostKeyChecking=accept-new
          -o IdentitiesOnly=yes
          {{ proxmox_ssh_user }}@{{ proxmox_host }}
          true
  register: ssh_key_test
  changed_when: false
  failed_when: ssh_key_test.rc != 0
  delegate_to: localhost
