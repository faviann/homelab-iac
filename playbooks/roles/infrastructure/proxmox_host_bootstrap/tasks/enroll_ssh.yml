---
- name: Reject Proxmox host SSH enrollment in check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: Proxmox host SSH enrollment cannot run in check mode.
    quiet: true

# Enrollment is the only operation that needs the key material itself, to name
# the identity it authorizes and to append it on the target.
- name: Resolve selected controller SSH public key
  ansible.builtin.include_role:
    name: infrastructure/ssh_key_shared
    tasks_from: resolve_pubkey

- name: Resolve selected controller SSH identity fingerprint
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -lf
      - "{{ ssh_key_shared_resolved_public_key_path }}"
  register: pubkey_fingerprint
  changed_when: false
  delegate_to: localhost

- name: Identify the authorized Proxmox host enrollment
  ansible.builtin.debug:
    msg: >-
      Selected identity {{ pubkey_fingerprint.stdout }} for
      {{ proxmox_ssh_user }}@{{ proxmox_host }}:{{ proxmox_ssh_port }}.

- name: Prompt for Proxmox host password
  ansible.builtin.pause:
    prompt: "Password for {{ proxmox_ssh_user }}@{{ proxmox_host }}"
    echo: false
  register: proxmox_root_password
  delegate_to: localhost

# One password-authenticated command does the whole enrollment. argv goes
# straight to execve, so no local shell reads the key or the connection
# arguments, and sshpass -e takes the password from the environment, keeping it
# out of both the process table and any shell. The key crosses base64-encoded,
# so the remote shell sees only that alphabet and a valid key comment cannot be
# reinterpreted there.
- name: Enroll selected identity on Proxmox host
  ansible.builtin.command:
    argv:
      - sshpass
      - -e
      - ssh
      - -p
      - "{{ proxmox_ssh_port | string }}"
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "ConnectTimeout={{ proxmox_ssh_connect_timeout }}"
      - "{{ proxmox_ssh_user }}@{{ proxmox_host }}"
      - |
        set -eu
        changed=0
        pubkey="$(printf '%s' '{{ ssh_key_shared_public_key_content | b64encode }}' | base64 -d)"
        [ -n "$pubkey" ]

        ssh_dir=/root/.ssh
        auth_keys="$ssh_dir/authorized_keys"

        umask 077

        if [ ! -d "$ssh_dir" ]; then
          mkdir -p "$ssh_dir"
          changed=1
        fi

        if [ "$(stat -c '%u:%g' "$ssh_dir")" != '0:0' ]; then
          chown 0:0 "$ssh_dir"
          changed=1
        fi

        if [ "$(stat -c '%a' "$ssh_dir")" != '700' ]; then
          chmod 700 "$ssh_dir"
          changed=1
        fi

        if [ ! -f "$auth_keys" ]; then
          : > "$auth_keys"
          changed=1
        fi

        if [ "$(stat -c '%u:%g' "$auth_keys")" != '0:0' ]; then
          chown 0:0 "$auth_keys"
          changed=1
        fi

        if [ "$(stat -c '%a' "$auth_keys")" != '600' ]; then
          chmod 600 "$auth_keys"
          changed=1
        fi

        if ! grep -qxF -- "$pubkey" "$auth_keys"; then
          printf '%s\n' "$pubkey" >> "$auth_keys"
          changed=1
        fi

        printf 'CHANGED=%s\n' "$changed"
  environment:
    SSHPASS: "{{ proxmox_root_password.user_input }}"
  register: proxmox_host_enrollment
  changed_when: "'CHANGED=1' in (proxmox_host_enrollment.stdout | default(''))"
  failed_when: >-
    (proxmox_host_enrollment.rc != 0)
    or ('CHANGED=' not in (proxmox_host_enrollment.stdout | default('')))
  no_log: true
  delegate_to: localhost

- name: Verify selected identity is enrolled on Proxmox host
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ proxmox_ssh_key_private }}"
      - -p
      - "{{ proxmox_ssh_port | string }}"
      - -o
      - BatchMode=yes
      - -o
      - "ConnectTimeout={{ proxmox_ssh_connect_timeout }}"
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - IdentitiesOnly=yes
      - "{{ proxmox_ssh_user }}@{{ proxmox_host }}"
      - "true"
  register: ssh_key_test
  changed_when: false
  failed_when: ssh_key_test.rc != 0
  delegate_to: localhost
