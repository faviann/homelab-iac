---
# Validate Proxmox host readiness for Ansible management
# Ensures required tools and access are available
# Live SSH tasks are read-only (check_mode: false) so --check still validates
# fully when key auth works; proxmox_ssh_ready is false only when check mode
# could not install the key, in which case live validation is skipped.

- name: Verify pct command works
  when:
    - proxmox_validate_pct | bool
    - proxmox_ssh_ready | default(true)
  ansible.builtin.command:
    cmd: pct list
  register: pct_list
  changed_when: false
  check_mode: false
  delegate_to: "{{ proxmox_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ proxmox_ssh_user }}"
    ansible_ssh_private_key_file: "{{ proxmox_ssh_key_private }}"
    ansible_ssh_common_args: "-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

- name: Check installed lxc-pve version
  when:
    - proxmox_validate_pct | bool
    - proxmox_ssh_ready | default(true)
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --showformat=${Version}
      - --show
      - lxc-pve
  register: lxc_pve_version
  changed_when: false
  check_mode: false
  delegate_to: "{{ proxmox_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ proxmox_ssh_user }}"
    ansible_ssh_private_key_file: "{{ proxmox_ssh_key_private }}"
    ansible_ssh_common_args: "-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

- name: Assert lxc-pve meets nested Docker minimum
  when:
    - proxmox_validate_pct | bool
    - proxmox_ssh_ready | default(true)
    - lxc_pve_version.stdout is defined
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ lxc_pve_version.stdout | trim }}"
      - ge
      - "{{ proxmox_min_lxc_pve_version }}"
  register: lxc_pve_version_check
  changed_when: false
  failed_when: lxc_pve_version_check.rc != 0
  check_mode: false
  delegate_to: "{{ proxmox_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ proxmox_ssh_user }}"
    ansible_ssh_private_key_file: "{{ proxmox_ssh_key_private }}"
    ansible_ssh_common_args: "-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

- name: Display detected containers
  when:
    - proxmox_validate_pct | bool
    - proxmox_ssh_ready | default(true)
    - pct_list.stdout_lines is defined
  ansible.builtin.debug:
    msg: "Detected {{ pct_list.stdout_lines | length - 1 }} LXC container(s) on {{ proxmox_host }}"

# Dynamic so the community.proxmox collection resolves only when API
# validation is requested.
- name: Test Proxmox API connectivity
  ansible.builtin.include_tasks: api.yml
  when: proxmox_validate_api | bool

- name: Proxmox host validation summary
  vars:
    pct_state: >-
      {{ 'available' if pct_list.rc is defined else 'not checked' }}
    lxc_pve_state: "{{ lxc_pve_version.stdout | default('not checked') | trim }}"
    api_state: "{{ 'working' if api_check is defined else 'not checked' }}"
  ansible.builtin.debug:
    msg:
      - "{{ '✓ ' if pct_state == 'available' else '' }}pct command: {{ pct_state }}"
      - "{{ '✓ ' if lxc_pve_state != 'not checked' else '' }}lxc-pve: {{ lxc_pve_state }}"
      - "{{ '✓ ' if api_state == 'working' else '' }}API access: {{ api_state }}"
      - "Proxmox host {{ proxmox_host }} validation complete"
