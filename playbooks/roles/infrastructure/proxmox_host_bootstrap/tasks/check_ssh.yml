---
# Reads target trust only. The live execution boundary already verified that
# the fleet key exists and its two halves pair.
- name: Test Proxmox host SSH port
  ansible.builtin.wait_for:
    host: "{{ proxmox_host }}"
    port: "{{ proxmox_ssh_port }}"
    timeout: "{{ proxmox_ssh_connect_timeout }}"
  register: ssh_port_check
  ignore_errors: true
  delegate_to: localhost

- name: Require a reachable Proxmox host SSH port
  ansible.builtin.assert:
    that:
      - not ssh_port_check.failed
    fail_msg: >-
      Cannot reach {{ proxmox_host }}:{{ proxmox_ssh_port }}. Check network
      connectivity and firewall rules.
    quiet: true

# Trust means a fresh public-key login with the fleet key. -F none keeps
# ssh_config from adding identities, remapping the host, or reusing a connection
# something else authenticated; IdentitiesOnly still ignores other agent keys.
# accept-new records the Proxmox host-key anchor in the fleet known_hosts only
# when it has none; a key that differs from the anchor fails the probe.
- name: Test fleet key trust on Proxmox host
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - none
      - -i
      - "{{ proxmox_ssh_key_private }}"
      - -p
      - "{{ proxmox_ssh_port | string }}"
      - -o
      - BatchMode=yes
      - -o
      - "ConnectTimeout={{ proxmox_ssh_connect_timeout }}"
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - UserKnownHostsFile=${HOME}/.ansible/known_hosts
      - -o
      - IdentitiesOnly=yes
      - -o
      - PreferredAuthentications=publickey
      - "{{ proxmox_ssh_user }}@{{ proxmox_host }}"
      - "true"
  register: ssh_key_test
  failed_when: false
  changed_when: false
  check_mode: false
  delegate_to: localhost
