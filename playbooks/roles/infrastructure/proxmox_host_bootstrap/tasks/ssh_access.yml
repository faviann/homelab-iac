---
- name: Check Proxmox host SSH trust
  ansible.builtin.import_tasks: check_ssh.yml

- name: Require existing Proxmox host SSH trust
  ansible.builtin.assert:
    that:
      - ssh_key_test.rc == 0
    fail_msg: >-
      The selected controller SSH identity is not trusted by
      {{ proxmox_ssh_user }}@{{ proxmox_host }}:{{ proxmox_ssh_port }}.
      This operation will not modify authorized_keys. Enroll it explicitly with
      `./recover.sh proxmox-host-ssh`.
    quiet: true
