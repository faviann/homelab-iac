---
- name: Resolve fleet public key path
  ansible.builtin.set_fact:
    ssh_key_shared_resolved_public_key_path: "{{ [lookup('env', 'HOME'), '.ansible', 'ssh', 'proxmox_lxc.pub'] | path_join }}"
  delegate_to: localhost
  become: false

- name: Check fleet public key path
  ansible.builtin.stat:
    path: "{{ ssh_key_shared_resolved_public_key_path }}"
  register: ssh_key_shared_public_key_stat
  delegate_to: localhost
  become: false

- name: Assert fleet public key exists
  ansible.builtin.assert:
    that:
      - ssh_key_shared_public_key_stat.stat.exists
    fail_msg: >-
      The fleet public key is missing at
      {{ ssh_key_shared_resolved_public_key_path }}. Restore or create the
      fleet key yourself; no playbook creates it.
  delegate_to: localhost
  become: false

- name: Load fleet public key content
  ansible.builtin.set_fact:
    ssh_key_shared_public_key_content: "{{ lookup('file', ssh_key_shared_resolved_public_key_path) | trim }}"
  delegate_to: localhost
  become: false
  no_log: true
