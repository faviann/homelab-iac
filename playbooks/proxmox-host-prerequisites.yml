---
- name: Validate control node health
  ansible.builtin.import_playbook: controller-prerequisites.yml

- name: Verify Proxmox host SSH access
  hosts: "{{ prerequisite_target_pattern | default('localhost') }}"
  connection: local
  gather_facts: false
  become: false
  roles:
    - role: infrastructure/proxmox_host_bootstrap
      proxmox_validate_api: false
      run_once: true

# Before any play connects to a targeted guest. Proxmox trust is verified above.
- name: Pin targeted guest host keys through Proxmox
  hosts: lxcs
  gather_facts: false
  become: false
  tasks:
    - name: Pin the guest's host keys
      ansible.builtin.include_role:
        name: infrastructure/ssh_key_shared
        tasks_from: pin_host_keys
