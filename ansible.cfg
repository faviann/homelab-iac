[defaults]
inventory = inventory/hosts.yml
roles_path = playbooks/roles:.ansible/roles
collections_path = collections
filter_plugins = playbooks/filter_plugins
library = library
# Fleet SSH checks host keys strictly against ~/.ansible/known_hosts (ssh_args below),
# never ~/.ssh/known_hosts. Each run pins every running guest's keys there, read through
# Proxmox by VMID (ADR-0021); Proxmox's own key is the anchor its trust check records.
# A mismatch fails the host as unreachable. Never clear an entry to get past one.
host_key_checking = True
retry_files_enabled = False
timeout = 30
stdout_callback = ansible.builtin.default
result_format = yaml
deprecation_warnings = False
bin_ansible_callbacks = True
interpreter_python = auto_silent
fact_caching = jsonfile
fact_caching_connection = .ansible/cache
fact_caching_timeout = 3600
local_tmp = .ansible/tmp

[privilege_escalation]
# become = True  # Disabled globally - enable per-task/play as needed
become_method = sudo

[ssh_connection]
pipelining = True
# Relative to the repo root (live-execution.sh cds there) so socket paths stay under the Unix limit.
control_path = .ansible/cp/%%h-%%p-%%r
# IPv4 only: the Firewalla answers AAAA :: for LAN names without IPv6, and ssh falls back
# to :: (this machine) when the target's IPv4 fails, which would run the target's tasks
# on the control node. ssh expands ${HOME} itself; its ~ ignores HOME.
ssh_args = -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s -o AddressFamily=inet -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ansible/known_hosts
