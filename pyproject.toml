[project]
name = "server-management-scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.20.4",
    "ansible-lint>=24.0.0",
    "jsonschema>=4.0",
    "yamllint>=1.32.0",
    "requests>=1.1",
    "proxmoxer>=2.0",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = ["pexpect>=4.9", "pytest>=8.0", "pytest-xdist>=3.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "serial: uses timing or shared host resources; run exclusively",
    "renovate_compat: runs the real pinned Renovate against public registries; only ./validate.sh renovate selects it",
]

[tool.uv]
package = false
